front:
  text: 南華眞經章句音義卷之十一習十一
  hash: sha256:d5a29de36219560c89aa255a77f7fc53674199e637287996a5752c6ef990e633
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5c0129_HFL_011-001a, image: hfl/0496/0496-076.png}
body:
  text: 碧虚子造雜篇庚桑楚二十七去智老聃之役司馬云役使也學徒弟子也庚桑楚司馬云楚名庚桑姓也太史公書作亢倉偏得音篇成云門人之中最勝故曰偏得畏烏罪切本作㟪壘力罪切何粲注亢倉子云畏壘山即羽山也在徐州畫然音獲挈然苦計也畫然謂計畫飾智者也挈然謂契約合仁者也皆起之姦僞失其自然也又苦結切提也亦仁愛也遠之于萬切司馬云言人以仁智爲臣妾庚桑子悉棄仁智也擁於勇切腫章勇切郭云擁腫朴也鞅掌於文切或云擁腫不材郭云鞅掌不自得向云二句朴纍之謂司馬云皆醜貌三年成云三歲一閏入道小成大壤而掌切廣雅云壤豐也灑然素殄切李云驚貌日計之而不足向云無旦夕小利也歲計之而有餘向云順天時而大穰正得秋而萬寳成天地以萬物爲寳至秋而成也元嘉本作萬實環圓也堵丁魯切司馬云一丈曰堵環堵者面各一丈言小也竊竊平章偶語也俎豆側吕切成云俎切肉之几豆盛脯之具皆禮器也俎豆食我於衆人間也杓音的又匹么切郭云爲物之標杓也王云斯由已爲人准的也司馬本作魡晋的尋常之溝八尺曰尋倍尋曰常尋常之溝則周禮洫澮之廣深也洫廣深八尺澮廣二尋深二仞也所還音旋回也鯢五兮切鰌音秋爲之制廣雅云制折也謂小魚得曲折也王云制謂擅之也鯢鰌專檀於小溝也步仞之丘陵六尺爲步七尺曰仞謂廣一步高一仞也孔安國云八尺曰仞又爾雅云四尺曰仞㜸魚竭切狐爲之祥李云祥怪也狐狸喜爲祅㜸言各有宜宜不失則大人有豐禄也王云野狐依之作祅祥也崔云蠱狐以小丘爲善也祥善也函音含車之獸李云獸大容車介而音戒廣雅云獨也一本作分謂分張也離山力智切吞舟敕恩切碭而失水徒浪切謂碭溢而失水也崔本作去水陸居也則蟻魚綺切苦之又作窮之深眇彌小切成云眇遠也二子向崔郭皆云堯舜也殖蓬蒲空切而櫛側瑟切與扻同說文梳比之總名也數米色主切而炊昌垂切向云理於利小也竊竊司馬云細語也一云計校貌軋於黠切註文軋𨋁也𨋁轢也𨋁轢車所踐也𨋁女展切轢力的切有弑音試下同穴阫普回切向云阫墻也言無所畏忌吾語魚據切南榮趎音厨昌于切庚桑子弟子也向音疇一音紹俱切徐直俱切又敕俱切又處由切漢書古今人表作南榮疇或作儔又作壽淮南子作南榮幬云敕蹻趹步百合不休蹴然子六切已長丁丈切將惡音烏亦辟婢亦切開也崔云必亦切相著也或間間厠之間勉聞道向云勉强也一本作晩達耳矣向云僅達於耳未徹入於心也一本作未達耳曰奔蜂孚恭切司馬云小蜂也一云土蜂也江南李氏本無曰字藿蠋音蜀司馬云豆藿中大青蠱也越雞司馬云小雞也或云荆雞也伏扶又切鳥抱子也鵠音鶴又户沃切卵力管切魯雞向云大雞也今蜀雞也贏糧音盈案方言贏儋也齊楚陳宋之間謂之贏一音果曰唯惟癸切懼然紀具切文云失容貌成云驚視貌一本作戄朱愚鍾輸切說文朱赤心木松栢屬也一曰丹也朱愚義取丹心愚惷也江南古藏本作柣愚眉睫音椄釋名云曰毛也規規李云失神貌一云細小貌若喪息浪切揭其列其謁二切竿音干而求諸海也向言以短小之物欲測深大之域也汝亡人哉崔云喪亡性情之人也惘惘乎文云不知所歸也所好呼報切所惡烏路切息愁舊作自愁劉得一作息愁文如海作愁息灑濯文角切鬱鬱吕覽曰水鬱則汙木鬱則蠹草鬱則蕢津津文云不淨也成云尚漏也猶有惡也李云惡計未盡也外韄音獲云束縛也三蒼云佩刀靶韋也本亦作獲向音霍繁多也概也而捉側角切成云捉持也内揵其輦切難也徐作揵其偃切關也閉也可繆莫侯切向云綢繆也放道如字向方往切依也衛生李云防衛其生令合道也能舍音捨下同翛音蕭文云无滯著貌侗大董切向敕動切云直而无累之謂三蒼云殻直貌文云无不通貌皞户羔切嗌音益喉也咽也李本作不嗌音厄云謂噎也文本同云氣不通也不嗄於邁切司馬云楚人謂啼極无聲爲嗄又聲破也握李云捲手曰握不掜五禮切廣雅云捉也成云挶拳也文云掜疲懈也共其崔云共壹也文云不偏用力嬰兒共有此德也瞚音舜動也偏音篇委於危切蛇以支切冰解音蟹交食崔云交俱也李云共也交樂音洛相攖於營切廣雅云亂也若槁苦老切惡有音烏自定宇泰定心宇大寧也人見其人物見其物見張君房本舊闕敗之補邁切以滑音骨靈臺靈府靈臺皆心也眞君處于内謂之府眞宰游於上謂之臺不見其誠己而發謂不自照其内而外馳也每發而不當丁浪切爾雅云每雖也謂雖有發動不中當也券内音勸券契也内屬我也外屬彼也契内者无名契外者賈衒而已說文券契也券别書之書以刀判契其旁故曰契也券郭忠恕佩觴券从刀或从力者勞券之券一曰止也逵眷切每妄更爲失妄見劉得一本舊闕期費若貴切期說文會也一曰要也費說文散財用也賈人音古同商賈之人費心於錐刀也人見其跂猶之魁然苦回切魁然不動貌一曰安也主也謂衆人已見其跂求分外而猶自安可羞愧之甚也物且且苟且也苟且其心容身不暇豈能容於人哉焉能於虔切莫憯七坎切廣雅云痛也鏌鎁音莫耶良劍名其分符問切下同所惡烏路切下同故出而不反謂眞蕩而不還也見其鬼謂陰炁來舍也出而得是謂得死失者同於得故曰得死滅而有實鬼之一也廣雅云滅殄也盡也天光已滅雖有實性與其㝠㝠之物不二也眞誥謂之清靈善爽之鬼出无本入无竅苦吊切造化無本大空無竅也乎處召據切下同有長如字本剽本作標甫小切崔云末也宇也四方上下爲宇也宙也往古來今曰宙出入而不見其形見張君房本舊作入岀移是惡乎音烏爲喪息浪切以分方云切爲尻苦羔切一宗一本作守昭景也著丁略切甲氏也著張慮切有生黬也於誠切司馬云烏簟切黶有疵也有疵者欲披除之披普皮切分散也然曰移是黬然聚而生披然散而死也臘力闔切者之有膍音吡司馬云牛百葉也賅古來切足大指也崔云備也按臘者大祭備物而肴有膍賅此雖從散禮應具不可散棄也其偃溲所留切偃溲屏厠也溲見江南李氏本舊闕爲是于僞切死償常亮切廣雅云償報也蜩音條鷽音學移是非今之人也非見江南古藏本舊闕禮偽蹍女展切踐也履也驁魚到切驕縱貌嫗烏遇切聲柔貌文云驚失聲一曰嫗詡愍問貌辟金必碩切除也虚无之勃必妹切下同之謬如字差也欺也一本作繆亡侯切繫縛之謂去德超吕切惡欲烏路切之累劣僞切下同不盪徒黨切郭云動也德性德之光一本作先猶睨魚計切視也拙偽羿五計切中微丁仲切而俍音良崔云良士也又音浪惡天爲路切下同智籠之籠力東切湯以庖白交切人籠伊尹伊尹負鼎以干湯湯知其賢故順其性以庖厨而籠之己解禪王篇秦穆公以五羊之皮籠百里奚百里奚亡秦走究楚鄙人執之穆公以五羊皮贖之於楚也或云百里奚好五色皮裘故因其所好籠之也已解田子方篇忘形同天介者音界郭云刖也廣雅云獨也拸畫敕紙切析也畫飾容之具今無足故不復愛之一云拸離也崔云拸畫不拘法度也夫復音服文云復温復也謵音習文云謵翫也不餽其愧切廣雅云遺也而忘人復者温復之謂也謂翫也夫人翫習者雖復小事皆所至惜今温復人之所習既得之矣而不還歸以饋遺之此至愚不獲人之所惜者也无復相爲之情故曰忘人侮之亡甫切南華眞經章句音義卷之十一
