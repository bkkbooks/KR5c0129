front:
  text: 南華眞經章句音義卷之八習八
  hash: sha256:251587872c555e614e895c3a3f5826056d4631c1851145dfb07f917f7622633b
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5c0129_SJB_008-150923b, image: sjb/15/150923b.png}
body:
  text: 碧虚子造雜篇在宥十七處无爲之事在說文曰存也宥音又寬也溼其性失性曰溼又耽滯曰溼遷其德失德曰遷人樂音洛恬徒謙切靜也瘁瘁在季切病也憂也愉音喻樂也毗司馬云助也并也喬欽消切郭音矯詰公吉切崔云喬詰意不平也卓敕角切鷙敕二切崔云卓鷙行不平也之行下孟切給相足也匈匈音凶諠譁競逐之貌是悖必内切逆也是相息亮切助也下同於技其綺切能也聖式正切說文曰通也成云聖謂聖迹也藝倪祭切技能也於疵疾斯切臠力轉切卷眷勉切司馬云臠卷不申舒狀傖音倉崔本作戕囊本作倉囊難承受也崔云戕囊猶搶攘亂也文云傖囊忽遽貌跪其詭切莅音利臨也故貴以身於爲天下則可以託天下愛以身於爲天下則可以寄天下此兩句與今所傳道德經稍異然與王弼本同疑開元校勘經時依别本改易之也今從漆園本爲定尸居龍見尸神象也不言而肅龍見取其變化而昇淵默如止水雷聲聞天下從容七容切自在貌炊昌睡切累劣僞切郭云如塵埃之自動也聖人虚心崔瞿求朱切古之賢人老聃吐藍切汝慎无攖人心於營切吕覽云始生之者天也飬成之者人也能養天之所生而勿攖之謂天子天子之動也以全天爲故者也高誘注云攖猶戾也故事也排皮皆切淖昌略切廉劌居衛切傷也利也琢丁角切縣而天高遠貌僨粉間切僵也驕僨驕馬之奔逸不可禁之勢又謂不顧禮法而犯之如馬之縱逸也黄帝始以仁義攖人心上古巢居穴處无火化粒食之養人多疾病之苦黄帝乃垂衣裳造屋室杵臼耕耨民始得衣食居止之樂是由黄帝之聖智治法耳人得其利因謂之仁蚩尤亂政殘賊生民黄帝征而誅之亦聖智治法耳人得其宜因謂之義然仁義自然其來尚矣而後世不知徒見其迹以謂仁義始于黄帝也股无胈畔末切白肉也脛形定切无毛言堯舜行黄帝之迹心形疲弊股瘦无白肉脛秃无細毛讙音歡兜丁侯切讙兜者帝鴻氏之子即混沌也崇山南裔也堯六十年放讙兜于崇山投三苗三苗者縉云氏之子即饕餮也三峗音危西裔之山也今屬天水堯六十六年竄三苗于三峗共工共工者少昊之子即窮奇也幽都幽州北裔也堯六十四年流共工于幽都施及以豉切延也大駭驚也善否音鄙惡也釿鋸音斤據制焉釿鋸制焉謂加肉刑也繩墨殺焉崔云謂彈正殺焉或云罪名已定者縛以墨繩未定者縛以赤繩縛罪人有降殺也椎直追切鑿在洛切决焉古穴切謂造枷杻用椎鑿以决孔竅也脊脊音藉在亦切相踐藉也一本作肴肴亂也堪苦巖切巖語咸切殊死殊斷也漢令曰蠻夷長有罪當殊之相枕之熓切桁户剛切司馬云長脚械也楊崔云械來頸及脛者皆曰桁楊離力智力氏二切跂丘氏切攘臂如羊切桎之實切梏古毒切椄音燮摺音習司馬云椄摺械楔也又椄摺桎梏梁也鴻烈解云大者爲柱梁小者爲椄摺鑿在報在洛二切枘人鋭切三蒼云柱頭枘也鑿頭厠木如柱頭枘焉知於虞切嗃矢許交切矢之鳴者又猛者也崔本此下更有有无之相生也則甚曾史與桀跖生有无也又惡得无相轂也凡二十四字清靜民正黄帝已解齊物篇廣成子古之得道人也空同山名云北戴斗極爲空同一云在梁國虞城東三十里之山見張君房本舊作上質也形質麤淺雲氣不待族而雨司馬云族聚也未聚而雨言澤少也草木不待黄而落司馬云落死也言殺氣多也翦翦司馬云善辯貌一曰佞貌李云淺短貌或云狹小貌捐悦金切棄也邀之古堯切遇也南首音狩向明也蹷其月切驚而超也吾語魚據切下同窈窈烏了切我爲于僞切下同有藏才浪切千二百歲矣李淳風天无主物薄云千二百歲謂之十大剋一曰陰陽之小紀也四九三十六三百六十四八三十二三百二十四七二十八二百八十四六二十四二百四十共一千二百之數百昌百物昌盛也緡乎武巾切遠我于萬切昏乎暗也司馬云緡昏並無心之謂也无爲民化雲將子匠切李云主雲師也鴻蒙元炁也寓言風云炁者取其无心而利物也拊髀音陛股也雀躍如雀之跳躍也倘然止尺掌切司馬云欲止貌贄然立之二切李云不動貌叟素口切長者之偁不輟丁劣切止也曰吁況于切六氣陰陽風雨晦明又云風寒暑濕燥火風木寒水暑火濕土燥金相火謂之六氣掉徒弔切有宋國名也鞅掌於丈切衆多也之放方往切効也噫音醫下同僊僊音仙輕舉貌墮許規切毁也吐如字說文寫也涬户頂切溟亡頂切涬溟渾然貌司馬云自然氣也渾渾户本切沌沌徒本切不離力離切下同持勝任道而惡烏路切因衆以寧所聞因衆人之所聞見委而任之則自寧安不如衆技其綺切衆矣若役我之知達衆人衆人之技多於我矣安得而不自困哉此攬音覽與擥同此以因人之國見江南古藏本舊闕僥古堯切倖音幸求利不止貌又僥要也以皇王之國利要求非分爲一身之幸會幾何居豈切不喪息浪切同下持後處先挈苦結切挈持也撓撓而小切聖人以自然携持萬物適性自動也惡乎音烏道無不爲匿而女力切藏也不易如字薄伯各切迫也雜篇至樂二十二至樂無爲至樂音洛篇内不出者皆同至極也樂歡也奚惡烏路切惛惛音昏張君房本作𠉣𠉣蹲循勿爭委順貌誙誙户耕切李云趣死貌吾未知之樂也亦未知之不樂也果有樂无有哉吾以无爲而誠者爲樂矣並見江南古藏本舊作吾未之樂也亦未之不樂也果有樂无有哉吾以无爲誠樂矣化生見江南古藏本舊闕芒乎音荒下同芴乎音忽下同芒然物之生忽然物之出忽生於無芒成於有萬物職職李云繁殖貌爾雅云職主也謂各有主而區别也遺情累箕踞音據成云謂垂兩脚如簸箕形也益瓦缶也與人居句絶長子丁丈切句絶今有變之而死見江南古藏本舊作今又變而之死无槩古代切司馬云感也成云驚歎也偃然成云安息貌巨室天地之間噭噭古吊切文云哭聲也化空支離叔滑音骨介音界叔二人或以支幹離散爲善或以滑稽介獨爲善叔善也㝠伯之丘崑崙力門切之虚音墟㝠寞大丘峻極之墟所休休息也左肘竹九切一作胕音趺云胕足上也蹷蹷姑衛切成云驚動貌集韻僵也一曰跳也蹢與蹷蹶同惡之烏路切下同塵垢音苟兩謬髑音獨髏音樓髐然有形苦堯切白骨貌有枯形也撽苦弔古的二切註文作摮云旁擊也馬捶拙蘂切馬杖也愧遺唯季切凍丁貢切餒奴罪切援音袁枕針䲴切見夢賢徧切向子之談者見張君房本舊闕從然七容切謂從容休然也張君房本作泛然復生音服深矉音頻蹙類上子六切本亦作顣下於葛切李云矉顣者愁貌王樂音洛而復扶又切爲生人之勞乎見張君房本舊作而復爲人間之勞乎名實褚音貯囊也懷容受也綆格猛切汲索也汲居及切而重直用切海鳥司馬云國語曰愛居也止魯東門之外三日臧文仲使國人祭之非魯侯也祀於魯廟故言魯侯筵之爰居一名雜縣舉頭高八尺形似鳳皇郷音訝觴音傷于廟司馬云飲之於廟中也九韶常遥切舜樂名眩音縣目無常主也一臠里轉切壇大丹切司馬本作澶音但云水涉澶也洲渚也食之音嗣鰌䱔音秋條隨行户剛切委於危切蛇以支切寬舒自得貌譊譊乃交切喧聲也咸池洞庭已解天運篇人卒子忽切衆也又寸忽切還音環繞也彼必相與異其好惡好惡異見江南古藏本舊作彼必相與異其好惡故異也化機道從司馬云從道旁也本作徒攓居輦切拔也蓬步東切汝果元嘉本作過飬司馬本作暮云死也予果元嘉本作過歡司馬本作嚾云呼聲謂生也種章勇切有幾居豈切若鼃爲鶉見劉得一本舊闕得水則爲繼音繼司馬本作繼云萬物雖有兆朕得水土之氣乃相繼而生也說文繼續也一曰反㡭爲絶今本作㡭是反㡭也得水土之際則爲鼃户媧切蠙步田切之衣司馬云言物根在水土際布在水中就水上視之不見抄之可得如張綿在水中楚人謂之鼃蠙之衣成云青苔布在水中若張綿俗謂之蝦蟆衣也生於陵屯徒門切山阜也則爲陵舄音昔司馬云言物因水成而陸産生於陵屯化作車前草改名陵舄也一名澤舄隨燥濕變也然不知其祖言物化無常形也人之死也亦或化爲草木草木之精或化爲人也陵舄得鬱棲則爲烏足李云鬱棲糞壤也言陵舄在糞壞化爲烏足草司馬云鬱棲蟲名烏足草名生水邊也言鬱棲在陵舄之中則化爲烏足也烏足之根爲蠐螬音齊曹蟲名其葉爲胡蝶音牒司馬云蛺蝶也草化爲蟲蟲化爲草未始有極胡蝶胥也胥相胥也言物相胥生也化而爲蟲生於竈下司馬云得熱炁而生也其狀若脱它括切謂剥皮也司馬音悦云新出皮悦好也其名爲鴝其俱切掇丁活切鴝掇蟲名鴝掇千日爲鳥其名爲乾音干餘骨乾餘骨之沫音末李云口中汁也爲斯彌蟲名斯彌爲食醯許兮切司馬云苦酒上蠛蠓也食醯生乎頤輅頤輅音怡路蟲名生乎黄軦音況蟲名黄軦生乎九猷音由李云九宜爲乆乆老也猷蟲名九猷生乎瞀莫逗切芮如鋭切小蟲也喜去亂飛又草名瞀芮生乎腐音輔蠸音權蟲名爾雅云一名守瓜又云瓜中黄甲蟲一云螢火蟲一云蚡鼠腐蠸生乎羊奚羊奚比毗志切已上朱書二十字見張君房本舊闕乎不箰息尹切乆竹生青寧司馬云羊奚草名根似蕪菁與乆竹比合而爲物皆生於非類也青寧蟲名青寧生程尸佼云程者中國謂之豹越人謂之貊即豹之别名也程生馬馬生人史記年表云秦孝公二十一年馬生人蓋一炁之變无所不適也南華眞經章句音義卷之八
