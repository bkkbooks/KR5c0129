front:
  text: 南華眞經章句音義卷之九習九
  hash: sha256:c3055bd421cf40aa839482903547fc980c2ef0c235a710499ac8f5b990eef039
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5c0129_SJB_009-150927a, image: sjb/15/150927a.png}
body:
  text: 碧虚子造雜篇達生二十三達生達生達暢也生有生也无離力智切下同相天息亮切專炁關尹關令尹喜字公度周大夫也不窒珍悉切蹈火徒報切之列音例予語魚據切是形色而已見江南古藏本舊闕得是是者不形不化之道也正焉見張君房本舊作止物焉於虔切之墜直類切後同乗亦音繩遻音悟爾雅云逆忤也郭云干觸也不慴之涉切懼也不折之舌切鏌音莫干鏌邪干將古之利劍名已解大宗篇忮心之豉切李云支害也字書云狠也飄瓦匹遥切李云飄落也不開人之人劉得一作不開人之人舊作不開人之天不厭於艷切幾乎音機一志痀於禹切僂音緀文云痀僂曲脊也承蜩音條蟬也文云承蜩謂黏蟬也古人用之以爲醢猶掇丁活切拾也五六月司馬云黏蟬時也成云習其累丸近于半歲累丸劣彼切下同文云謂累彈丸於竿頭也錙側其切錙說文六銖也一曰八兩曰錙銖音殊銖說文權十分黍之重也一曰十黍爲絫十絫爲銖橛其月切株音誅拘其俱切與劬同音立木也橛株枸者斷木也張君房及東南古藏並集韻所說並從拘舊本從拘恐寫誤執臂執持也若槁苦老切矜重觴深之淵成云觴深淵名其狀似柸因以爲名在宋國操舟七曹切成云捉也數能音朔下同之覆芳服切下同惡往音烏瓦殶朱戊切見江南古藏本舊作泣李云擊也吕覽引莊子曰以瓦殶者翔以鉤殶者戰以黄金殶者殆其殶一也而有所殆者必外有所重者也外有所重者泄蓋内掘也符子曰夏王使羿射方寸之帖徑寸之的百發而無遺鏃王曰善爾更射中賞爾萬金不中則削爾十邑羿色動心戰射皆不中王曰爾由喜懼爲灾萬金爲患故也此義相類耳憚徒丹切忌惡也難也驚也懼也𣧟又作殙音昬門緬二音普訓矜善牧田開之李云開之名也周威公崔云周威公竈成云周公之後莫顯其名食采於周謚曰威祝之大切腎市軫切或作賢學生司馬云學養生之道也操七曹切拔蒲末切李云杷也篲以歲切帚也而鞭如字崔本作𧽏云匿也視其羸瘦在後者匿著牢中養之也𧽏音搜趙𧽏行不進也單豹音善李云魯之隱人張毅成云魯之富人見高門縣薄簾也見見劉得一本舊闕无不走也李云走往也司馬云走至也言无不至門奉富貴也戒微畏塗阻險之道可畏懼者也卒徒子忽切卒衆也最畏見江南古藏本舊作取衽席而甚切卧衣也從竹卧席也通作衽趣異祝宗人成云太常六祝官也牢筴初革切李云牢豕室也筴木欄也說如字又始鋭切彘直例切奚惡烏路切豢音患養也見張君房本舊作㹖篇韻不收恐轉寫誤本亦作犠曰齊側皆切後章同藉在夜切尻苦羔切睢也彫俎莊吕切俎盛肉器也彫謂畫飾之也爲彘于僞切自爲同如食音嗣糠糟音康音遭錯之七故切置也腞直轉切楯食準切腞猶篆楯猶案也聚僂力主切棺槨也其所異彘者何也見張潜夫本舊闕釋疑仲父音甫誒於代切說文可惡之辭也詒吐代切司馬云懈倦貌李云誒詒失魂魄貌數日所主切皇子告敖司馬云姓皇字告敖齊之賢士也鬼惡音烏忿拂粉切滀敕六切之氣散而不反則爲不足李云忿滿也滀結聚也精神有逆則陰陽結於内魂魄散於外故曰不足也上而不下則使人善怒下而不上則使人善忘李云陽散則陰凝故怒陰發陽伏故忘也不上不下中丁仲切身當心則爲病李云上下不和則陰陽爭而攻心心精神主故病也沈有履司馬本作沈有漏云沈水汙泥也漏神名也竈有髻音結司馬云髻竈神名著赤衣狀如美女户内之煩壤雷霆處之劉得一本作墳壤云墳壤中鬼名雷霆倍音裴阿鮭户蝸切蠪音龍司馬云倍阿鮭蠪神名狀如小兒長一尺四寸黑衣赤幩大冠帶劍持戟泆陽音逸司馬云泆陽豹頭馬尾一作狗頭一云神名也罔象司馬本作无傷云狀如小兒赤黑色赤爪大耳長臂一云水神名宰所巾切司馬云狀如狗有角文身五采夔求龜切狀如鼓而一足彷音傍徨音皇司馬云狀如蛇兩頭五采文委於危切蛇如字轂古禄切說文輻所凑也轅于元切說文輈也朱冠司馬本作俞冠云俞國之冠也其制似螺惡聞烏路切捧芳勇切辴敕引切李云大笑貌不爭紀渻所景切人姓名爲于僞切王司馬云齊王也文本作周宣王虚憍居橋切李云高仰頭也成云虚怯憍矜自恃意炁響許文切景於領切李云應響鳴顧景行見者反走矣見見文如海本舊闕習成性吕梁司馬云河水有石絶處也今西河離石西有此縣絶世謂之黄梁淮南子古者龍門未鑿河出孟門之上也成云宋國彭城郡有吕梁水縣注而下當是此也縣水三十仞音刃七尺曰仞沫音末黿音元鼉徒多切鼈必滅切有苦病也拯之拯救之拯被髮皮寄切行歌司馬本作行道云常行之道也長乎丁文切下同與齊司馬云回水如磨齊也郭云磨翁而旋入者齊也關東人呼磑爲磨翁與汨古忽切司馬云湧波也郭云回伏而湧出者汨也擇材梓慶李云魯大匠也梓官也慶名也鐻據巨二音司馬云樂器也形似夾鍾削木爲之與虞同云飛虞天上神獸也鹿頭龍身又鍾鼓之柎多飾爲猛獸耗呼報切損也炁文云炁耗則心動心動則神不專也齊側皆切下同輒然丁協切不動貌公朝直遥切滑消音骨亂也成見賢徧切其由是與音餘由見江南古藏本舊作其是與過巧東野稷李云東野姓稷名司馬云孫卿作東野畢御見賢徧切下同莊公舊音義云衛莊公也中繩丁仲切下同文弗過也司馬云謂過織組之文使之鉤百而反司馬云稷自矜其能圖而驅之如鉤復迹百反而不知止顔闔户臘切魯之賢人元嘉本作盧崔同忘伎工倕音垂堯時巧人旋而蓋規矩指與物化而不以心稽音雞故其靈臺一而不桎之實切旋疾也工倕施巧旋疾蓋亦不離于規矩指畫之間與物之變化无異而心未嘗稽留者廼任物性之自然故神宇凝一而不桎閡也足屨九住切妄要一遥切忘是非張君房作忘是非舊作知忘是非審授孫休成云魯人也踵章勇切司馬云至也而詫敕駕切司馬云告也子扁慶子音篇李云扁姓慶子字也成云魯之賢人臨難乃旦切賔於必刃切斥也惡遇音烏下同芒然武剛切无心貌彷徨音傍皇成云放縱貌長而丁丈切明汙音烏若揭其列切負也九竅苦弔切跂彼我切蹇紀輦切而比如字爲具于僞切以樂音洛下同食之音嗣委於危切蛇如字李云大鳥吞蛇司馬云委蛇泥鰌也則安平陸而已矣安見劉得一本舊闕款啓李云款空也啓開也如空之開所見小也又款曲啓發也鼷音兮小鼠鴳音晏雀類雜篇山木二十四顯晦在道山中釋名山産也産生物也說文云山宣也能宣散炁生萬物也大木釋名云木冒也冒地而生也李云木衆林之總名白虎通云木踴也夫子成云門人呼莊子爲夫子也舍於成云舍息也烹普彭切煮也无訾音紫毁也爲量音亮人倫之傳直專切司馬云事類可傳行也則挫子卧切文皮爲災市南宜僚了蕭切司馬云姓熊名宜僚居于市南因以爲號楚人也魯侯文云魯哀公也成云先王王季文王先君周公伯禽也无須臾離力智切居成本讀句絶云離離散也居安居也豐狐司馬云豐大也胥疏胥相也疏稀也謂相望稀疏也機辟婢亦切成云機辟罝罘也刳形音枯成云忘身也去皮起吕切文云遺魯也下去欲去君同灑心先典切猖狂成云无心也妄行成云混迹也可樂音洛无形倨音據司馬云无倨傲其形无留居司馬云无留安其居大莫莫无也虚己免害方舟方說文併船也象兩舟偏心必善切爾雅云急也則呼火故切下同號𧦝也張歙許及切張開也歙斂也因循成化北官奢李云衛大夫居北宫因以爲號奢其名也爲于僞切賦斂力豔切鍾樂器名也或云鑄鍾十二口爲壇言鑄鍾先須設祭故爲壇也上下之縣司馬云八音備爲縣而聲有高下之異或云架上下兩層也王子慶忌李云王之族也慶忌名也周大夫也怪其簡速故問之侗乎吐東切無知貌儻乎敕蕩切萃乎在畔切聚也芒乎莫郎切彊梁成云剛彊難賦者從而任之曲傅音附司馬云謂曲附已者隨而順之不挫子卧切成云挫損也大塗成云大道也无能遠禍圍於陳蔡已解禪玉篇太公任李云太公大夫之稱任其名子幾音機子惡烏路切下同翂翂音紛翐翐音秩司馬云翂翂翐翐舒遲貌一云飛不高貌迫脇而棲李云不敢獨棲迫脇在衆鳥中纔足容身而宿避害之至也其緒說文絲耑也今取其殘碎之餘也行列户剛切下亂行同不斥音尺成云故衆鳥行列不獨斥棄也人卒子恤切終也明汙音烏揭其列切大成之人成云聖德宏博生成庶品謂之大成老君是已自伐成云伐取也者墮許規切成云敗也去功起吕切得行如字文云天下皆得至人所行之道至人不處其名衣於既切裘褐户割切杼食汝切又音序天屬相收子桑雽音户本又作雽音于李云桑姓雽名隱人也再逐於魯伐樹於宋削迹於衛窮於商周圍於陳蔡已上並解禪王篇何與音餘下倣此假古雅切李云國名成云晋下邑也嘗遭晋滅林回司馬云商之逃民之姓名成云賢人也布謂貨財也布於民間因以名之无挹音楫李云無所執持也眞或作直泠音零禹司馬云泠曉也謂以眞道曉悟禹也泠或爲命又作令命令猶教也德隱衣於既切大布司馬云麤布也正緳賢節切司馬云帶也係履李云履穿故係而過古禾切魏王司馬云惠王也憊皮拜切司馬云病也柟音南梓豫章皆端直好木也攬本作擥歷敢切蔓音萬成云擥蔓猶把捉也王往況切長丁亮切成云自得貌司正直良切云兩枝相去長遠也羿音詣蓬蒙符恭切又音蓬司馬云羿古之善射者蓬蒙羿之弟子也睥普計切睨音詣李云睥睨哀視也枯棘章夜切枳音紙枸音矩並有刺之木也不便婢面切亂相悉亮切比干見賢徧切徵也夫豈非應驗也大達左據槁木苦老切謂几也右擊枯枝謂琴也焱氏必遥切古之元爲帝王也又神農也犁然力兮切司馬云犁然猶栗然清淡貌有當丁浪切還目音旋回眎也而窺起規切造大司馬云造適也一云造作也損易以豉切下同窮桎之實切運化見江南古藏本舊作運物之泄息例切司馬云發也言與之言猶謂也鷾鴯音意而成云鷾鴯燕也目之所不宜處昌吕切言不可止處目已羅絡知之故棄之也不給視說文給相足也謂几所不宜處則不足視也落其實實卵也而襲音習成云襲入也社稷文云社稷猶窠也其禪市戰切司馬云授予也成云禪代也焉知於虔切下同失照雕音彫陵之樊音煩司馬云雕陵陵名樊藩也謂遊栗園藩籬之内也樊或作埜古野字運寸司馬云可四一寸也感周之顙息蕩切類也感觸也翼殷不逝目大不睹殷大也曲折曰逝夫翼大逝難目大視稀故不見人也褰起虔切舊作蹇躩驅碧九縛二切司馬云疾行也論語云足躩如也執彈徒旦切留之力救切司馬云宿留同其便也螳螂音堂郎執翳於計切翳謂斧也螳蜋執斧如蓋以自蔽也搏之音博捕也忘其形說文形象形也忘其身說文身身躬也象人之身爾雅云我忘其眞眞性也反入宫見江南古藏本舊闕爾雅云宫謂之室室謂之宫藺力信切且子餘切司馬云藺且莊子弟子從其俗江南古藏作從其今栗林虞人文如海本无栗林二字爲戮戮恥之辱自賢陽子司馬云陽朱也逆旅之有妾一人見劉得一本舊作逆旅人而去起吕切之行下孟切南華眞經章句音義卷之九
