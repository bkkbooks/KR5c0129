front:
  text: 南華眞經章句音義卷之六習六
  hash: sha256:65ce234b28419822f30491deb845055eda2eb7f456edbe2d3d6965667862cbc7
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5c0129_SJB_006-150914c, image: sjb/15/150914c.png}
body:
  text: 碧虚子造外篇刻意十一守純素刻意刻削也謂刻意令峻也意者心之用也又意志也尚行下孟切離世力智切高論力困切怨誹音沸徐音非李云非世无道怨己不遇也爲亢苦浪切李云窮高曰亢枯槁苦老切所好呼報切下同此朝直遥切藪素口切釣魚雕叫切與魡同呼吸許及切熊經如字又古定切鳥申禽之展足曰申導引李云導炁令和引體令柔澹大暫切之質質正也故曰聖人休焉休則平易平易則恬惔矣見張君房本舊作聖人休休焉則平易矣平易則恬惔矣邪炁似嗟切下同去起吕切其覺古孝切純粹雖遂切不罷音疲非樂音洛下同好惡烏路切於忤五故切逆也干越之劍李云干谿越山俱出良劍又吴有谿名干谿越有山名若邪並出善鐵鑄爲名劍柙而户甲切下蟠音盤外篇繕性十二恬智相養繕性於俗學以求復其初滑欲於俗思以求致其明見張君房本舊作繕性於俗俗學以求復其初滑欲於俗思以求致其明繕時戰切補也滑音骨亂也智生而无以智爲也見張君房本舊闕信行下孟切下以行小行同樂徧江南本作偏史記云樂極則憂禮粗則偏矣鄭玄注云樂人之所好也害在溼夸禮人之所勤也害在偏略又云及夫敦樂而无憂禮備而不偏者其唯大聖乎不冒莫報切覆也混胡本切芒莫剛切崔云混混芒芒未分時也澹徒暫切不擾而小切應節見張君房本舊作得燧人音遂伏戲音羲燧人伏戲皆古之帝王𣝨古堯切淳音純離道力智切心與心識如字向本作職云彼我之心競爲先職博溺乃瀝切世喪息浪切下同弗見賢徧切危然郭云獨正貌司馬本作恑獨立貌崔本作垝音如累垝之垝垝然自持安固貌又何爲乎哉見張君房本舊作又何爲哉樂全音洛下同非性命之有也見張君房本舊作非性命也儻來吐黨切意外忽然來者耳崔作黨衆也可圍魚吕切與禦同扞也不爲于僞切下同倒置之民崔云逆其性命而不順也向云以外易内可謂倒置外篇說剱十三神武趙文王司馬云惠文王也名何武靈王子洞紀云周赧王十七年趙惠文王之元年一云案長歷推惠文王與莊子相值雖然亦恐寓言以暢意也喜劍許記切下同夾門音協好之呼報切下同不厭於監於豔二切悝苦回切太子名當何敢言見張本舊作尚募音慕說王解也如字又音悦與使所吏切幣從才用切蓬頭步公切謂著兜鋒也有眊故如蓬成云髮亂如蓬突鬢必刃切鬢毛突出云又云謂鬢髮短可淩突人也垂冠將欲鬥故冠低傾也一曰突騎帽也曼胡莫干切曼胡之纓謂麤纓无文理也成云屯項抹額也短後之衣成云爲便於武事也瞋目赤眞切張也語難艱難也勇士憤氣積於心胸言不流利也又乃旦切既怒言語爲人所畏難與見賢徧切下劍見同王脱士活切千里不留行十步殺一人則千里无敢拒者乃校司馬云考校取其勝者也一本作教士敦都昆切司馬云敦斷也試使用劍相擊斷截也御杖直亮切用杖也燕音煙谿石城爲鋒成云燕谿地名在燕國石城在塞外此地居北故以爲鋒鋒劍端也齊岱爲鍔五各切成云齊國岱岳在東故以爲鍔鍔劍刃也又劍稜也晋衛爲脊成云晋衛二國近趙地故爲劍脊也周宋爲鐔音淫成云周宋二國近南故以爲鐔鐔劍環也又劍珥也其旁鼻也帶所貫鐔也又音尋韓魏爲鋏古協切成云韓魏二國在趙之西從以爲鋏鋏劍把也又云鐔從稜向背鋏從稜向刃也裹以音果渤海滄州也常山北岳也五行以五行制區宇刑德論刑德臨御群生行以秋冬隨天道以行止也制論開持行皆鑄造行用也芒然莫剛切四鄉四方也肝肺芳廢切竊爲于僞切三環繞也聞義而愧繞饌三周不能坐食服斃婢世切忿不見禮皆自殺也外篇漁父十四貴眞緇維司馬云黑林名也或作帷杏壇司馬云澤中高處也杏生其上又壇名也漁父或云是范蠡也鬢眉一本作須眉交白交俱也一本作皎揄音遥謂垂手衣内而行也袂面世切距陸距至也飾禮一本作飭音敕齊民齊等也謂齊等之民也又平民也君與音餘下同以危或作僞其分又作介離也杖杖即橈也方言楫謂之橈或從舟挐音如說文持也又女居切牽也還鄉香亮切或作嚮緒言猶先言也又餘論也竊待或作侍咳苦代切唾吐卧切相丘息亮切助也曰嘻香其切笑聲也之好呼報切下同丘少詩召切下同而經經營也又理也度也不屬音燭長少丁文切後遇長同不勝音昇行不下孟切工技其綺切貢職或作賦春秋後倫朝覲不及等比也攘伐攘除也不音敕八疵祀知切病也之揔覽也監也以敗補邁切毁他曰敗惡人烏路切下同張君房本作德人之慝他得切善否悲美切惡也兩容顔適善惡皆容顔貌調適也以挂音卦别也之叨吐刀切狠胡壑切愀然七小切慙悚貌愈數音朔不離力智切故彊其丈切下同歡樂音洛下同禄禄如字又音録謂形見爲禮也司馬云録領録也可與往者往進也早湛丁南切下同溺也丘得遇也或作遇謂得過失也而比如字謂親見比數也又毗志切乃刺七亦切波定謂船行故水波去遠則波定旁車步浪切萬乗繩證切下同伉禮苦浪切敵也倨音據敖五報切曲要一遥切磬折之設切吾語魚據切雜篇讓王十五治内堯以天下讓許由語在逍遥篇子州支父音甫李云支父字也即支伯也幽憂之病吕氏春秋引此章高誘注云幽隱也詩云如有隱憂我心不悦未暇在於治天下也處身舜讓天下於子州支伯或云支伯即支父也自得舜以天下讓善卷眷勉切姓善名卷隱士也衣皮於既切下同其處昌慮切嵩蹈舜以天下讓其友石户亦作后之農石户地名農農人也捲捲音權勤節貌葆力葆蔽用力也以入於海司馬云凡言入於海者皆居其洲島之上與其曲隈中也尊生太王亶丁但切父音甫下同亶父文王之祖也邠筆貧切地名也狄人獫狁也不以所用養害所養地所以養人也今爭以殺人是以地害人也人爲地養故不以地害人也因杖直亮切筴初革切相連如字相連續而從之也舊音力展切或作摙同謂擔連物也岐山其宜切山在扶風美陽西北其南有周原故始改國曰周不以養傷身不以利累形王云富貴有養而不以昧養傷身貧賤无利而不以求利累形也惡患越人三世弑其君音試文云僖王一也惠王二也哀王三也王子搜素羔切文云哀王子名搜也丹穴南戴曰爲丹穴南山洞也又朱崖縣也以艾五蓋切玉輿玉輅也一本作王輿援音爰引也綏車上繩也而呼火故切或作歎君乎君乎重歎君位之難也以舍音拾非惡烏路切下及下章眞惡同知輕重子華子司馬云魏之賢人昭僖侯司馬云韓侯也攫之俱縛俱碧二切取也廢棄也一云攫者授書銘廢者斬右手其輕於韓又遠句絶完身魯君一本作魯侯李云哀公也以幣先使人召顔闔欲爲相也苴音麤有丁麻也直作麤者非是飯牛符晩切飼也之使所吏切下章同家與音餘恐聽謬見張君房本舊作恐聽者謬吕氏春秋引此章亦作恐聽謬而遺唯季切下章同復來音服下章同緒餘並如字謂殘餘也土敕雅切又如字苴側雅切司馬云土苴如糞草也李云土苴糟魄也皆不眞物也吕氏春秋引此章高誘注云土瓦礫也苴草薊也土鼓薊桴伊耆氏之樂也孝經云安上治民莫善於禮移風易俗莫善於樂故可以治天下必察其所以之王以聖人眞以持身餘以爲國故其動作必察之焉所以之者謂德所加之方也所以爲者謂所以待物也動作於此不必察也隨侯之珠隨國近漢水漢出實珠隨侯見蛇傷以藥封之後蛇銜明珠徑寸純白夜光燭室以報隨侯故謂隨侯之珠也所要一遥切遠非義子陽鄭繆公相也不好呼報切即令力呈切拊心音撫佚樂音逸絡君過古卧切經過也作難乃旦切下章同而殺子陽子陽嚴酷罪者无赦舍人折弓畏子陽怒責因國人逐猘狗而殺子陽遵法度楚昭王失國屠羊說音悦昭王名軫平王子也平王聽費无忌讒殺伍奢伍員奔吴已而吴伐楚楚大敗昭王出奔隨當是時也有屠羊說從昭王出奔而復歸國也從者才用切彊之其丈切見之賢徧切下同入郢以井切毁約如字徐於妙切其爲于僞切三旌三公位也司馬本作三珪云謂諸侯之三卿皆執珪也妄施如字又始豉切守節原憲字子思魯人孔子弟子環堵之室周環各一堵方丈室也茨疾私切蓋屋茅也以生草謂以青草代茅蓋屋蓬户織蓬爲户桑以爲樞尺朱切屈桑條爲户樞也饔牖音酉破甕爲牖二室夫妻各一室褐以下葛切爲塞悉代切以褐衣塞牖也匡坐而弦歌匡正也歌見張君房本舊闕中紺古暗切李云紺爲中衣加素爲表又紺中素表大夫之服華冠胡化切以華木皮爲冠縱履所倚切或作屣又作躧云躡也又履不著跟曰屣又體不能躡舉而曳之也杖藜以藜爲杖也應門自對門也嘻許其切笑聲也逡巡七旬切却退也希世而行司馬云希望也所行常顧世譽而動故曰希世而行也比周毗志切周旋親比以結朋黨爲人于僞切下爲己同教以爲己學當爲己教當爲人今反不然仁義之慝吐得切惡也司馬云謂依仁託義爲姦惡也養志緼袍訏粉切司馬云謂麻緼爲絮論語云衣敝緼袍是也腫章勇切噲古外切司馬云腫噲剥錯也王云盈虚不常貌又皮膚皴裂而腫胼薄田切胝竹尼切皮堅也纓絶繩斷也肘竹九切見袖破也踵决履敗也商頌追美商之德也行修飦之然切或作饘粥之六切飦粥厚粥也飦一音干謂干餅絲麻一本作臬麻自樂音洛愀然七小切一本作欣以羨自累也羡見江南李氏本舊作利行修下孟切不怍在洛切慙也趣高公子牟司馬云魏之公子封中山名牟瞻子魏之賢人魏闕司馬云象魏觀闕人君門也天子兩觀也重生直用切下同自勝音升下同不能自勝則從句絶神无惡也見張君房本舊作乎萬乗繩證切樂道不糝素感切甚憊皮拜切再逐於魯史記云孔子貧且賤及長嘗爲季氏吏料量平嘗爲司職吏而畜蕃息由是爲司空已而去魯斥乎齊逐乎宋衛困於陳蔡之間於是反魯魯復善待定公以孔子爲中都宰一年四方皆則之由中都爲司空由司空爲大司寇由大司寇爲攝相事齊人聞而懼曰孔子爲政必霸於是選女樂遺魯君魯君受之怠於政事孔子遂行適衛此再逐於魯也削迹於衛削絶也史記云靈公老怠於政事不思孔子孔子喟然嘆曰苟有用我者期月而已三年有成終不見用伐樹於宋史記云孔子之宋與弟子習禮大木下宋司馬桓魋欲殺孔子孔子去後桓魁惡其坐處因伐其木馬窮於商周史記云商是殷地周是東周孔子歷聘嘗困于此圍於陳蔡史記云楚昭王使人聘孔子孔子將往陳蔡大夫謀於是乃相與發徒役圍孔子於野不得行從者病莫能興藉秦昔切毁也又陵藉也喟然去愧切語之魚據切臨難乃旦切桓公得之莒文公得之曹越王得之會稽此十六字見江南古藏本及吕覽舊闕之隘音厄又於懈切削然如字切援琴聲也扢然許訖切李云舊舞貌執干干楯也亦樂音洛下同虞於穎陽廣雅云虞安也一本作娱娱樂也共伯音恭下同得志乎丘首司馬云共伯名和修其行好賢人諸侯皆以爲賢周厲王之難天子曠絶諸侯皆請以爲天子共伯不聽即干王位十四年大旱屋焚卜于太陽兆曰厲王爲崇召公乃立宣王共伯復歸于宗逍遥得意共山之首共丘山今在河内共縣西江南古藏本作共伯得志乎丘首一云共山之首或云丘首羞辱畎古犬切畝壟上曰畝壟中曰畎行下孟切下章同漫武諫武畔切云汙也下章同投歸投也清泠音零之淵在南陽郡西崿山下廉清因就也卞隨成云卞隨懷道而隱者也務光已解大宗師篇伊尹史記云伊尹名阿衡欲干湯而无由乃爲有莘氏媵臣負鼎俎以滋味說湯致於王道或曰伊尹處士湯使人聘迎之五反然後肯往從湯言素王及九主之事湯舉任以國政賊謂陰料時事也數聞音朔稠水直留切或作桐水又作稠司馬本作洞云洞水在潁川一云在范陽郡界其難乃但切我享受也廬水音閭司馬作盧水在遼東西界一云在北平郡界避世孤竹司馬云孤竹國在遼西令支縣界伯夷叔齊其國君之二子也姓名已解大宗師篇岐陽岐山之陽文王所都之地今之扶風叔旦周公名旦是武王弟故曰叔一列一本作級血牲以牲血釁其盟誓之書埋之壇下嘻許其切析喜福也盡治直吏切下治世同揚行下孟切下吾行戾行同以要一遥切殷德衰見江南古藏本舊作周以塗吾身恐富貴塗汙吾身耳成云若與周並存恐汙吾行也或曰讓王之篇其章多重生而務光二三子自投于水何也答曰莊書之興存乎反本反本之由先于去榮是以明讓王之一高標傲世之逸志㫖在不降以厲俗无厚身以全生所以時有重生之辭者亦歸棄榮之意耳深於塵務之爲弊也其次者雖復被褐啜粥保身而已其全道尚高超俗自逸寧投身於清泠終不屈於世累也此舊集音有聊復録之於義无當也南華眞經章句音義卷之六
