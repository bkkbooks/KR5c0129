front:
  text: 南華眞經章句音義卷之二習二
  hash: sha256:d0ab217b0be4a49bcb79b1dff8186f0e53644677f774604a8036f3ffbbdffe19
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5c0129_SJB_002-150898b, image: sjb/15/150898b.png}
body:
  text: 碧虚子造內篇齊物論二齊我南郭子綦音其成云楚昭王之庶弟莊王之司馬名定字子綦有道之士居于南郭因以爲號隱於蘄切憑也几音紀而嘘音虚吐氣爲嘘嗒焉吐荅切解體貌似喪息浪切下同其偶五口切匹也對也司馬云偶身也身與神爲偶成云身與神爲匹物與我爲偶文云喪偶者謂忘形神也顔成子游李云子綦弟子也姓顔名偃謚成字子游何居斤於切處也槁木古老切人籟力帶切簫管之音也風俗通云舜作簫其形參差象鳳翼十管管長二尺郭璞云簫管長一尺二寸一名爲籟今詳其義籟者取其聲之衆也故有地籟天籟非止簫籟之稱也地籟衆竅之聲也天籟即人籟地籟之聲會歸天然故曰天籟夫音扶大塊苦怪苦對二切元氣也混成也司馬云大朴之貌噫乙戒切文云吐氣也萬竅苦弔切怒呺胡刀切成云猶鼓怒呺叫也文云出聲也翏翏良救切長風之聲也李作飂通作參畏於鬼烏罪二切佳醉癸子唯二切李云畏佳山阜貌成云扇動貌之竅崔本作窾似鼻似口司馬云言風吹竅穴動作或似人鼻或似人口似枅音雞柱上方木也今之斗㭼是也簡文云欂櫨也似圈超權其院二切杯圈也徐邈曰如羊豕之闌圈也似臼其九切洼者烏携烏蛙二切司馬云若洼曲也污者音烏司馬云若污下也激經歷切如水激也古弔切司馬云聲若激唤也謞者音孝李虚交切簡文云若箭去之聲司馬云若讙譎之聲叱者昌實切司馬云若叱咄聲吸者許及切司馬云若嘘吸聲叫者古弔切司馬云若叫呼聲譹者音豪司馬云若譹哭聲宎者於堯切一音杳司馬云深者也若深宎宎然咬者於交切又音狡司馬云聲哀切咬咬然唱于如字唱喁五恭切又音愚李云于喁聲之相和也泠風音零李云泠泠小風也小和胡卧切下同飄風鼻遥切司馬云疾風也爾雅云回風爲飄厲風司馬云大風也向云烈風也濟子細切向云止也調調音條刁刁都堯切向云調調刁刁皆動摇貌比竹毗志必履二切自取成云猶自得也齊智大智閑閑何間切安也小智閒閒古莧切間别也炎炎于廉切成云猛烈也簡文云美盛貌詹詹音占李云小辯貌崔作閻閻魂交文云寐則魂神交合是陰闔也其覺古孝切形開文云覺則形識開張是陽闢也與接爲構人世接識構結懽愛縵者末旦切寬慢也窖者古孝切深固也密者隱匿也小恐曲勇切惴惴之瑞切心不寧也縵縵𠉣忘其性也機栝古活切機弩牙栝箭栝詛側據切呪也盟音明誓也其殺色界切衰也其溺奴狄切其厭於葉切没也如緘古咸切繩也老洫弋質切深也義取深溺江南古藏本作溢復陽陽謂生也哀樂音洛熱之涉切司馬云不動貌姚音遥輕浮貌一云長也佚音逸縱放貌一云過也啓詰以切開張貌態敕代切憍淫貌一云意也蒸之膺切成菌其隕切芝菌也得此忘言之道亦常道也未有彊名故云此也眞宰養生主也其朕除忍切兆也百骸户皆切成云百骨節也六藏江南古藏本作五藏六府夫心肺肝脾腎謂之五藏大小腸膀胱三焦謂之六府身别有九藏氣天地人天候頭角之氣人候耳目之氣地候口齒之氣三部各有天地人三三而九神藏五形氣四故曰九舊本云六藏者謂腎有兩藏也其左爲腎右爲命門也命門者謂精神之所含也男子以藏精女子以繫胞其氣與腎通故言藏有六也賅古來切司馬云備也簡文云兼也其遞音弟眞君太一尊也苶然乃結切簡文云疲病困之狀芒乎莫剛切芒昧也成心謂妄成是非之心也與有如字黨與之與也神禹史記云謚法泉源流通曰禹又受禪成功曰禹字文命鯀之子啓之父也神禹者謂大禹治水有神功故謂之神禹東巡狩至于會稽而崩年百歲也吹也如字又叱瑞切猶鳴也鷇音苦豆切司馬云鳥子欲出卵中而鳴曰鷇音一云破卵出鶵曰轂齊是非道惡乎隱音烏下同眞僞或作眞詭崔本作眞然者也儒墨儒學宗周公文王墨學宗夏禹道樞尺朱切如户樞之義中空而轉物也以指喻指之非指以馬喻馬之非馬夫指馬之義自司馬彪向秀郭象至有唐名士皆謂漆園寓言構意而成斯喻遂解疏者㫖歸不同今按公孫龍六論内有白馬指物二論乃知漆園稽考述作有自來矣故備録二論附章句餘事之後以示將來云故爲于僞切下以義求之莛音廷司馬云屋梁也楹音盈司馬云屋柱也厲如字惡也李音賴病癩也西施司馬云夏姬也按句踐所獻吴王美女也恢苦回切大也簡文本作弔恑九委切成云奇變也憰怪音决李云憰乖也怪異也其分如字復通扶又切下以義求之幾矣音機盡也謂之道句絶崔讀謂之道勞云因自然是道之功勞狙公七徐切司馬云狙公典狙官也崔云養猨狙者也廣雅云狙獼猴也賦茅音序與杍同橡子也賦謂敷布之義朝三暮四司馬云朝三昇暮四昇天均崔本作釣陶釣也昭文之鼓琴司馬云古之喜琴者師曠成云字子野晋平公樂師或云賢大夫冀州南和人生而無目善音律能致鬼神之枝策司馬云枝柱也策杖也崔云舉杖以擊節也惠子之據梧成云謂惠施以梧爲机據而談論猶隱机者也或謂梧爲琴非是故載之末年以其始好不廢故書之於今也堅白之昧終夫離堅白合同異前輩亦講說不一今備録公孫龍堅白論續指物白馬論之後以補闕疑而其子又以文之綸終音倫綸緒也崔云琴弦也雖我无成亦可謂成矣見江南古藏本舊作雖我亦成也滑疑古没切亂也所圖圖者蜆畫限域也謂域於分内紫而不用也秋毫司馬云兔毫在秋而成至秋而尖細故以喻小也殤子短命者也或云年十九以下爲殤巧曆謂巧於曆數也齊道有封封域也有畛之忍切畛界畔也李音具謂封域畛陌也有左有右左陽右陰有倫有義崔本作有論有議有分如字有辯别也有競有爭並逐曰競對辯曰爭又謂爭鬥之爭不稱尺證切不嗛欺簟切盈也又猨藏食處也不嗛者猶無所蓄藏也徐邈音謙謂不貪故無所謙遜也仁常而不周見江南古藏本舊作成不忮之豉切逆也害也园五丸切圓也幾向其衣切天府無不藏葆光無不蔽也齊治堯舜並解逍遥篇宗膾古外切胥息徐切敖五高切三國名也崔云宗一膾二胥敖三也一云宗膾叢支胥敖蓬艾喻其蕃國卑小十日並出鴻烈解云堯時十日並出謂祅蠻也俾羿射之中其九日烏落而死者謂九日潜退也齊物齧五結切缺丘悦切王倪五嵇切高士傳云王倪齧缺並堯時賢人惡乎音烏下同庸詎其據切字林未知詞也庸謂庸常也詎何也偏死司馬云偏枯死也鰌音秋魚名惴之瑞切慄音栗恂音荀並恐懼戰悚貌猨猴音袁侯芻初俱切小爾雅云秆謂之芻豢音患司馬云牛羊曰芻犬豕曰豢以所食得名麇音眉成云似鹿而尾長薦牋練切司馬云美草也三蒼云六畜所食曰薦蝍音即蛆子餘切蜈公也爾雅云蒺藜蝍蛆似蝗大腹長角能食蛇腦帶崔云蛇也蝍蛆好食蛇眼䲭尺夷切鳶也鴉於加切烏也嗜市志切猵匹羨切狙七餘切司馬云猵狙一名獦牂似猨而狗頭其雄喜與雌猨交異類牝牡也獦音葛牂音臧或以徧狙爲二名獦牂爲二名皆非也爲雌如字又音妻毛嬙在良切越王美姬也麗姬力知切晋獻公之嬖以爲夫人也决喜缺切驟士救切决驟疾貌崔云疾走不顧爲决驟樊然音煩樊然猶糾紛也殽亂何交切謂殽饌之雜亂泫户故切向云凍也崔云沍涸也飄風振海毗霄切見江南李氏本舊闕齊死生瞿鵲子其俱切士之道號也猶如鶡冠子長梧子名立李云居長梧下因以爲號簡文云長梧封人夫子向云瞿鵲之師孟浪並如字向云孟浪音漫瀾無所趣舍之謂李云猶較略也崔云不精要貌或云率略也之行下孟切黄帝即本朝聖祖天尊也按大中祥符五年十月二十四日眞宗皇帝御製聖祖九天司命保生天尊降臨記云吾人皇九人中一人之數是趙之始祖吾於世有功故再降乃軒轅黄帝母氏感電夢天人生於壽丘史記云生而能言後得道昇天聽敕定切瑩於迥切認可道爲妙常猶視玉色以耳聽也時夜謂雞能司時夜見彈徒旦切鴞于驕切毛詩草木疏云大小如斑鳩緑色其肉甚美可以作炙陳藏器本草拾遺云鴞古人重其炙固當肥美一名梟一名鵂吴人呼爲𩴂魂惡聲鳥也賈誼云鵩似鴞其實一物也一曰𪇑鶘妖鳥也之奚音兮何也審何聲也旁日月薄葬蒲光二切依也挾户牒切崔本作扶宇宙治救切尸子云天地四方曰宇往古來今曰宙脗武軫切李云無波際貌向音脣若兩脣之相合也滑古沒切亂也向本作汩涽音昏滑涽紛亂未定貌愚芚徒奔切芚然無知直往貌劉得一作芼莫報切注云若愚而昏芼說文艸覆蔓也相藴於本切積也予惡音烏下惡乎同惡死烏路切弱喪息浪切文云秦人孩孺移家于楚戀楚忘秦故云弱喪麗姬已解在前艾封麗戎國艾地守封疆人之女王所崔云獻公僣偁王蘄音析求也覺音教下同竊竊竊竊自私貌如竊盜之自私也弔如字弔生曰唁弔死曰弔詭九委切其解音蟹者是旦暮遇之也達道之士以萬世猶旦暮王子年拾遺記云扶桑萬歲一枯長生人視之如旦暮此其類爾齊同異黮闇音暗李云黮闇不明貌惡能音烏下同天倪崔霓二音自然之分則是之異乎不是也其无辯矣見江南古藏本舊作亦无辯然若果然也則然之異乎不然也亦无辯矣見江南古藏本舊无矣字化聲爭辯是非之聲其猶變化耳曼音萬衍以戰切文云不停滯貌司馬云无極貌搌暢也止也无竟極也窮也崔作境齊因罔兩郭云景外之微陰向云景之景也崔本作罔浪云有無之狀纍乃蕩切李云曏也無特獨也或作持操與音餘蛇蚹音附成云蛇蚹蛇蜕皮也蜩翼成云蜩翼非翅也謂蟬蜕殻也與寓言篇蜩甲同言非如蛇蚹蜩翼之類有所因待吾之獨化出於自然何所待哉齊化胡蝶徒協切蛺蝶也栩栩况甫切文云適性貌成云忻暢貌徐云喜貌崔本作翩翩自喻李云快也成云曉也志與音餘下同覺古孝切蘧蘧音渠李云有形貌文云驚怪貌崔本作據據引大宗師云據然覺今本亦作蘧內篇養生主三養性分有涯魚佳切分也又作崖縁督以爲經縁由也督正也經常也以養羊尚切得生理庖丁白交切庖人丁其名也成云掌厨丁役之人管子有屠牛坦一朝解九牛刀可剃毛文惠君司馬云梁惠王也所倚於綺切所踦音螘觸也刺也砉然呼鵙切司馬云皮骨相離聲響然許文許亮二切奏進也騞然呼獲切崔云聲大於砉也中音丁仲切下同桑林司馬云湯樂名崔云宋舞樂名左傳襄十年宋公享晋侯於楚丘請以桑林注桑林湯天子之樂名經首司馬云咸池樂章名則堯樂也或云秦樂名譆音熙歎聲也技具綺切下同所好呼報切臣以神遇向云暗與理會謂之神遇不以目視集道遺照官知止官法也法在知止而理未可停是以一朝解九牛也而神欲行空窾己忘批備結鋪迷二切擊也大卻去逆切謂閒郤交際之處大窾苦管切空也肯苦等切著骨肉也一曰骨無肉也許叔重云骨肉肯肯著也綮苦挺切司馬云猶結處也文云肯綮謂交聚也大軱音孤郭云軱戾大骨也崔云槃結骨也良庖良善也割也司馬云以刀割肉故歲歲更作崔云歲一易刀猶堪割也族庖司馬云族雜也衆也硎音刑磨石也爲戒于僞切下同課然化百切成云骨肉相離之聲也已解音蟹下同牛不知其死也見文如海劉得一本舊闕提刀徒嵇切躊直留切躇直於切閑豫貌善刀而藏之善穩善也收刀不麤惡也遺刑累父文軒司馬云姓公文氏名軒宋人也右師官名宋人也惡乎音烏介音戒崔本作兀又作𧿁斷足也郭云介偏刖也天與其人與並如字又並音餘司馬云爲天命爲人事使獨司馬云一足曰獨或獨曰介有與如字郭云兩足共行曰有與遠樊籠澤雉澤中之雉也一啄陟角切不蘄音析求也樊中音煩李云藩也所以籠雉也雖王于况切志氣盈豫貌又盛也釋縣解老聃吐藍切廣聖義云字伯陽或字聃生楚國苦縣瀨郷身長九尺蹈五把十美眉方口雙柱三漏日角月淵具大聖之相居岐山之陽西伯詔爲守藏史康王時爲柱下史昭王時西度函關在周二百餘年秦失本又作俠各依字讀老君友也三號户羔切其人也文本作至人也少者詩照切遁天徒遜切逃遁天理也倍情布對切加也倍加俗情也哀樂音洛下同二本作憂樂縣解崔云以生爲縣以死爲解火傳直專切傳者相傳繼續也南華眞經章句音義卷之二
