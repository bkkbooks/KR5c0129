front:
  text: 南華眞經章句音義卷之一莊子姓莊名周或字子休宋之蒙城人也與梁惠王齊威王同時嘗爲漆園吏師長桑公子受其微㫖著書十萬餘言目之曰南華論其學本於黄老又師楚人蜎淵後隱於抱犢山服北育火丹白日昇天補太極闈編郎唐開元十九年五月四日侍中裴光庭請册四子天寳元年二月二十日詔册莊子宜依舊號曰南華眞經文子號曰通玄眞經列子號曰冲虚眞經庚桑子改爲洞靈眞經南華者義取離明英華發揮道妙也內篇逍遥游一内七篇曰漆園所命名也夫人能无己然後功名泯絶始可以語其逍遥游矣逍遥游者以其獨步方外矜誇未忘故次之以齊物論夫齊也者忘物而自齊也而未齊者即有彼我之論焉彼我循環入環中之空則齊矣能以空自齊者未識死生之主故次之以養生主主者精神骨骸之眞君也形猶薪也主猶火也夫能存火者薪也薪盡則火滅矣唯善養者莫知其盡復有獨耀者不能與人群故次之以人間世夫處汙而不染者善能和光同塵同塵故有德故次之以德充符德形則物忘唯隱晦者才全才全則可以爲師故次之以大宗師爲師者莫如眞人眞人豈得有心哉无心則可以貳造化故次之以應帝王夫帝王者大道之原教化之主居四大之一爲萬物之尊廣矣深矣相者莫能測矣其駢拇而下别无指義編次皆重復衍暢七篇之妙云
