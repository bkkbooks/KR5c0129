body:
  text: 順化逍遥北㝠本亦作溟覓經切嵇康云取其溟漠无涯也梁簡文帝云窅㝠无極也鯤公渾切爾雅魚子也名鯤者謂魚卵初化未辯鯨鰍取其混同之義蓋言鯤爾鯤之將大不知其幾千里也鵬古字作朋以爲朋黨之義故岀聲與衆禽不别也蓋言朋輩爾朋之將飛不知其幾千里也南㝠南海也義同北㝠齊諧户皆切司馬彪云人姓名簡文云書名摶徒端切鳥飛空以爪摶風作勢騰翥也扶摇爾雅云飈風也色邪也嗟切助句不定之辭後倣此是而已矣見文如海本舊作則坳堂於交切成无英云堂庭坳陷之地芥吉邁切李頤云小草也則膠古肴切又如字李云黏也風斯相支切析也今培薄回切益也禮記曰墳墓不培培猶治也夭於表切司馬云折也閼於葛切司馬云止也李云塞也蜩田聊切司馬云蟬也鷽鳩於角切本亦作學或作鷖音預司馬云小鳩也毛詩草木疏云鶻鳩斑鳩也我决喜缺乎穴二切李云疾也搶七良切司馬云集也崔云著也支遁云突也榆音踰木名枋而止音方李云檀木也文如海及江南古藏本作搶榆枋而止控苦貢切司馬云投也引也崔云叩也莽莫浪莫朗二切蒼七蕩切又如字成云郊野之色遥望之不甚分明也三餐七丹切果然文本作顆飽貌舂束容切糧音良彼之二蟲又何知也見文本舊作之二蟲又何知朝菌其隕切司馬云犬芝也天陰生糞上見日則死一名白及故不知月之終始也崔云糞上芝朝生暮死晦者不及朔朔者不及晦支遁云舜英朝生暮落潘尼云木檯也間文云欻生之芝也晦朔朔旦也晦㝠也蟪音惠蛄音姑司馬云蟪蛄寒蟬也一名蝭蟧春生夏死夏生秋死崔云蛁蟧也或曰山蟬春鳴者不及秋秋鳴者不及冬楚詞云寒螿也一云夏蟬也生於麥梗中亦謂之麥節夏生秋死故不知春秋也㝠靈本作幎李云木名也生江南以葉生爲春葉落爲秋此木以二千歲爲一年大椿丑倫切李云生江南一云生北方也此木三萬二千歲爲一年此大年也見成本舊闕彭祖成云姓籛名鏗帝嚳之遠孫善養性能調鼎進雉羹於堯堯以其善調味必能養生善養生者必能養人遂封於彭城其道可祖故謂之彭祖歷夏經商至周年八百歲特聞崔本作待聞極變逍遥湯史記云謚法除虐去殘曰湯帝嚳之後契之苗裔姓子字天乙有聖德放桀於南巢棘李云湯時賢人博物者也窮髮崔云北方无毛地也山以草木爲髮羊角司馬云風曲上行若羊角斥昌石切指名也一曰大也鴳亦作鷃於諫切雀類也翶翔五刀切回飛也行下孟切比毗至扶至二切李云合也而玉篇音能奴登切說文熊屬足似鹿能獸堅中故偁賢能也或如字而安也易宜建侯而不寧鄭氏讀今不取徵如字司馬云信也崔云成也宋榮子司馬云宋國賢人猶然笑之李云謂猶以爲笑加沮慈吕切敗也數數音朔下同司馬云猶汲汲也崔云迫促意也簡文所渝切謂計數也列子李云鄭人名圄寇或作御寇得風仙乗風而行與鄭穆公同時陸機要覺云列子御風常以立春歸于八荒泠然音零成云輕舉貌六氣風寒暑濕燥火謂之六氣司馬云陰陽風雨晦明也之辯平免切辯者變也郭象注云御六氣之辯者即是游變化之塗也惡乎音烏成云猶於何也無己音紀無己逍遥堯史記云謚法翼善傳聖曰堯帝嚳之子姓伊祁字放勛有聖德年十五封唐侯二十一年登帝位都平陽堯立七十年得舜二十年而老今舜攝行天子之政薦之於天堯避位凡二十八年年百一十八在位九十八年而崩葬陽城於詩爲唐國許由高士傳云字仲武陽城槐里人遁耕穎水之陽箕山之下謚曰箕公爝火音爵又子召切字林云炬火也一云爟火謂小火也時雨成云神農時十五日一雨謂之時雨浸子鴆切灌古亂切天下治直吏切致理成功曰治直基切理也下不再出以義求之鷦子遥切鷯音遼郭璞云桃雀也成曰巧婦鳥也一名工雀一名女匠偃鼠如字說文鼢鼠也李云鼷鼠也成云偃鼠形大小如牛赤黑色獐蹏蹏有三甲象耳尾端白好入河飲水金樓子云晋寧縣境内岀大鼠其狀如牛土人謂之偃鼠天時將灾鼠則從山中出遊畎畝散落其毛悉成小鼠五稼盡耗也庖人鮑交切掌厨人也周禮有庖人職尸祝之六切尸者太廟中神主也祝者太常祝也謂執祭版對尸而祝之一云傳鬼神辭曰祝樽子存切本作尊酒器也俎側吕切肉器也无功逍遥肩吾李云賢人也連叔李云懷道人也接輿音餘高士傳云姓陸名通字接輿楚人隱之賢者也與孔子同時而佯狂不仕常躬耕楚王遺使以黄金百鎰車駟二乗聘之不應於是夫負妻戴以游山海莫知所終无當丁浪切司馬云言語宏大无的當也驚怖普布切懼也逕古定切庭敕定切李云逕庭謂激過也成云過差也亦是直往不顧之貌藐音邈又弭沼切簡文云遠也姑射音液李食亦切山名在北海中婥約昌略切李云柔弱貌處子文云謂守雌靜而不爲物所傷也疵在斯切病也司馬云毁也癘音厲李音賴惡病也狂梁王切李云癡也瞽音古目无縫如鼓皮也與乎音豫及也下同之觀古亂切聾鹿工切耳不聞也瞽哉見天台山方瀛觀古藏本舊作盲時女司馬云猶處女也向云時女虚靜柔順和而不唱未嘗求人而爲人所求也旁薄剛切又作磅礴薄博切司馬云旁礴猶混同也萬物以爲一句絶世蘄音析求也乎亂本作乿古治字後人轉寫作亂弊弊扶世切簡文云弊弊經營貌浸子鴆切稽音雞至也溺奴歷切塵垢古口切猶染汙也粃悲矣切糠音康猶煩碎也陶徒刀切範土也鑄朱庶切鎔金也堯舜堯已解前章史記云舜謚法仁聖盛明曰舜顓帝六世孫也父曰瞽叟母曰握登感大虹而生生於姚墟因即姓姚生於嬀水亦曰嬀氏目有重瞳因字重華以仁孝著於郷黨堯聞其賢妻以二女封邑於虞年二十以孝聞三十總百揆年五十攝行天子事年五十八堯崩年六十一代堯踐帝位都蒲圾或言平陽或言潘潘今上谷也踐位三十九年南巡狩崩於蒼梧之野葬於江南九疑是爲零陵无名逍遥宋人宋今梁國睢陽縣商後微子所封資章甫李云資貨也章甫商冠也以冠爲貨越會稽山陰縣斷丁管徒短二切司馬作敦敦斷也四子司馬云王倪齧缺被衣許由汾水之陽扶云切成云汾水出太原西入于河水北曰陽今晋州平陽縣在汾水北昔堯都也窅然烏了切李云猶悵然成云深遠貌喪其息浪切適物逍遥惠子司馬云姓惠名施宋人也爲梁惠王相魏王成云梁惠王也昔居安邑國號爲魏後爲强秦所逼徙於大梁復改爲梁僣號稱王貽音怡遺也瓠音護種章勇切而實五石成云大可容受五石也盛音成剖普口切判也成云分割也瓢毗遥切勺也則瓠户郭切又音護下同本作鏗音鑊落簡文云瓠落猶廓落也司馬云瓠布護也落零落也言其形平淺受水則零落而不容也呺然許橋切李云呺虚大貌崔作𧦢吾爲于僞切掊之方垢切司馬云擊破也龜手愧悲切龜手黑皮皴皺也洴扶經切浮也澼普歷切李云澼聲也成云澼猶擗也絖繭也謂擗繭於水中也絖音曠小爾雅云絮細者謂之絖李云洴澼絖者漂絮於水上絖絮也以百金以見江南古藏本舊闕李云金方寸重一斤爲一金百金謂百斤也鬻音育賣也技竭彼切術也以說始鋭切又如字有難乃旦切之將子匠切大敗必邁切不慮以爲大樽司馬云樽如酒器縛之於身浮於江湖可以自渡所謂腰舟也慮謀思也蓬之心郭云蓬生非直達者向云蓬者短而不暢曲士之謂也无爲逍遥樗敕魚切木名成云栲漆之類嗅之甚臭惡木也或云似椿擁腫章勇切李云猶盤癭不中丁仲切下同卷曲音權成云不端直也同去如字李羌吕切狸力之切徃姓生二音司馬云㹨也成云野猫也敖者五到切支遁云伺彼怠傲謂承夫間殆也司馬音遨謂伺遨翔之物而食之雞鼠之屬也跳音條不辟音避下倣此機辟毗亦切成云機關之法覆車之類也罔罟音古成云罝罘也犛牛吕之切李音來成云犛牛猶旄牛也出西南夷其形甚大山中遠望如天際之云无何有之郷廣莫之野成云莫无也謂寬曠无人之處不問何物悉皆无有故曰无何有之鄉彷薄剛切徨音皇彷徨猶翱翔也一本作方羊廣雅云彷徉徙倚也成云縱任之名也安所困苦哉文本作安所窮困哉南華眞經章句音義卷之一
