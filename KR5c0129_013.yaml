  text: 南華眞經章句音義卷之十三習十三
  hash: sha256:d05201aabcf0f73a2daace4c0a3b754c8f4ae1b026f422ffc4199c3b852ae390
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5c0129_HFL_013-001a, image: hfl/0496/0496-120.png}
body:
  text: 碧虚子造雜篇則陽二十九抑進則陽司馬云名則陽字彭陽一云姓彭名則陽周初人也成云魯人遊事諸侯後入楚欲事楚文王也夷節楚臣王果司馬云楚賢人成云楚大夫也不譚音談李云註也公閲休音悦隱士也獨初角切司馬云刺也山樊音煩李云傍也司馬云陰也廣雅云邊也成云茂林也予宅司馬云以隱居山陰不自顯也文云宅山傍而爲居顛㝠音眠司馬云顛㝠猶迷惑也言其交結人主情馳富貴暍音謁字林云傷暑也橈乃孝切王云惟正德以至道服之佞人以才辯奪之故能泥橈之也化卑居高而以卑爲本也本或作而化卑於人也樂物音洛而飲於鴆切綢直周切繆亡侯切纏綿也文云有爲交結也周盡一體所鑒綢繆粗精洞盡故言周盡一體一體天也復命摇作摇動也萬物動作生長各有天然則是復其命也命之也命名也憂乎智而所行恒无幾居豈切時其有止也若之何王云憂乎智謂有爲者以形智不至爲憂也不知用智必喪喪而更以不智爲憂及其賀之所行有弊无濟故共憂患根接无須臾停息故曰恒无幾時其有止也不能遺智去憂非可憂而何生而美者人與之鑑不告則不知其美於人鑑生便有物之美而爲无心人與作名言鑑耳故人美之人若不相告即莫知其美於人也好之呼報切暢然喜悦貌之緡民忍切郭云合也與脗同司馬云盛也十九謂見十識九也見見聞聞見所見聞所聞冉相氏息亮切郭云古聖王也嘗舍音捨皆殉辭俊切所行之備而不洫况壁切深也義取染溺也李音溢濫也王云壞敗也无心偕行何往而不至故曰皆殉也所行之備而物我无傷故无壞敗也門尹登恒向云門尹官名登恒人也爲之于僞切下同傅之音付下同之名嬴音盈法得其兩見賢徧切得其隨成之道以司其名名實法立故得兩見猶人鑑之相得也容成氏老君師也著書十四篇止鬥魏瑩音瀅司馬云魏惠王也與田侯牟司馬云齊威王也名牟桓公子按史記威王名因不名牟約乙却切又如字司馬云在惠王二十六年背之音佩刺之七賜切犀首魏官名也司馬云若今虎牙將軍公孫衍爲此官萬乗繩證切匹夫從讎成云謂无官職夫婦相匹偶者也從讎報讎也爲君于僞切下請爲君同拔其國拔者克城邑而取之言若拔草木並得其根忌也出走成云田忌齊將也忌畏而走或言圍之也抶敕一切三蒼云擊也折之舌切季子魏臣文云魏國之公子也又壞音怪華子亦魏臣也惠子惠施也而見賢徧切下同戴晋人梁國賢人惠施薦之於魏王蝸音瓜李云蝸蟲有兩角俗謂之蝸牛三蒼云小牛螺也一云俗名黄犢逐北如字北陰幽之處故謂退敗奔走者爲北曰噫於其切言與音儉餘然音敞字林云惘也成云恨恨貌有嗃許交切管聲也廣雅云鳴也劍首司馬云劍環頭小孔子吷音血字吷然如風過也遠佞蟻丘魚綺切李云山名也之漿李云賣漿之家登極司馬云極屋揀也外之以觀也一曰乎頭屋也稯稯音總李云聚貌聖人僕謂懷聖德而隱僕隸也司馬本僕作樸謂聖人之坏樸也藏於畔王云修田農之業是隱藏於壠畔聲銷音消司馬云小也大云銷聲滅迹人不識也不屑屑絜也不絜世也陸沈司馬云當顯而及隱如无水而沈也冶形長梧封人長梧地名成云地多長梧因以名焉封人守封疆之人子牢司馬云即琴牢孔子弟子也鹵音魯莽莫古切滅裂猶短草也李云謂不熟也郭云魯莽滅裂輕脱末略不盡其分也司馬云鹵莽猶粗疏也謂淺耕稀種也滅裂謂斷其草也變齊改變齊民之法也一曰才細切說文禾麥吐穗上平也耰音憂司馬云鋤也廣雅云推也字林云摩田器也厭湌音孫餔也一曰水沃飯曰湌離其力智切下同以衆爲如字王云謂凡事所可爲者也遯離滅亡皆猶衆爲衆爲所謂鹵莽也司馬本作衆僞欲惡烏路切之孽魚列切萑音丸葦類葦于鬼切蘆也蒹古恬切蒹葭也葭音加亦蘆也並潰回内切漏發李云謂精氣散泄上潰下漏不擇所出也漂本作瘭敷妙切疽七餘切瘭疽謂病瘡膿出也疥音界㿈音邕溲或作瘦所求切膏司馬云謂虚勞人尿上生肥白沫也皆爲利欲感動失其正氣不如深耕熟耰之有實也涉塵栢矩文云魯人有道之士欲往齊行化辜人罪人也李云謂應死人也一云棄市暴死者彊之其良切朝服直遥切而幕音莫司馬云覆也號天户刀切大菑音灾離之離著也文云被也匿女力切文云藏也不勝音升循物蘧其居切伯玉成云蘧姓名瓊字伯玉衛之賢大夫詘超勿切廣雅云曲也郭音黜然與音餘然乎言未然也素定大弢吐刀切伯常騫超虔切狶虚豈切韋成云三人並史官姓名湛丁南切樂之乆也又音沈樂音洛諸侯之際司馬云盟會之事同濫盧瞰切說文汜也或作檻胡暫切浴器也史鰌音秋司馬云史魚也所搏音博幣帛也浴巾也司馬音蔽云引衣裳自蔽而扶翼司馬云謂公及浴女相扶翼自隱也故墓一本作大墓沙丘地名在盟津北畔掘之其月切洗西禮切不馮音憑其子司馬云言子孫不足可憑故使公得此處爲冢也奪而埋之一本作奪而里之而汝也里居處也究理少知成云智照狹劣謂之少知大公調成云道德廣大公正無私復能調頤群物故謂之大公調蓋寓言也丘里之言地方一里爲井丘十六井也李云四井爲邑四邑爲丘五家爲鄰五鄰爲里古者鄰里井邑土風不同猶今郷曲各自有方俗而物不齊同合十姓百名一姓爲十人十姓爲百名則有異有同故合散以定之積卑如字一本作庳音婢合水一本作合流合並而爲公士井郡縣而爲公天不賜賜與也五官成云古有五行之官文云五等諸侯也淳淳王云流動之貌文云無常也所拂扶弗切戾也氣之廣者也廣見劉得一本舊作大而讀李云讀猶語也惡起音烏欲惡烏路切橋超如字王云高勁貌言所超之動疾也片合音判又如字隨序謂變化相隨有次序也序或作厚一本作享橋運之相使橋運謂相橋代頓至次序以相通理橋運以相制使也季眞接子成云並齊之賢人季眞以無爲爲道接子以有爲爲道各執一家未爲通論雜篇外物三十无必外物王云夫忘懷於我者固无對於天下然後外物无所用心焉若乃有所執爲者諒亦无時而妙矣今詳外物之恒者善惡忠孝之謂也物我相對内我而外物以其善惡忠孝不能全生故曰爲善无近名爲惡无近刑龍逄比千已解人間世篇箕子狂史記云紂爲溼泆箕子諫不聽人或曰可去矣箕子曰爲人臣諫不聽而去是彰君之惡而自說於民吾不忍爲也乃被髮佯狂而爲奴逆隱而鼓琴以自悲故傳之曰箕子操惡來死史記云蜚廉生惡來惡來有力蜚廉善走父子俱以材力事紂武王伐紂並殺惡來是時蜚廉爲紂作石椁於北方姓嬴名惡來有力者也紂之嬖臣與紂同誅伍員已解胠篋篇萇弘周靈王之忠臣爲劉恭公所譖徙於蜀自恨忠而被譖遂自刳腸而死蜀人憐之以櫝盛其血三年而化爲碧碧石名也吕覽云藏其血三年化爲碧玉孝己憂成云孝己高宗太子遭後母之難憂苦而死曾參悲李云曾參至孝爲父所憎嘗見絶糧而後穌成云遭父打鄰乎死地故悲泣也大絯音駭兩陷謂善惡之蔽俱陷没于憂苦之中螴音陳又楮允敕盡二切蜳音惇文云不申貌又柱允敕轉餘准三切司馬云螴蜳讀曰仲融言怖畏之氣忡融兩溢不安定貌慰愍武巾切慰鬱也愍悶也沉屯張倫切司馬云沉深也屯難也僨然音頽文云无心至頤也急難貸本亦作音貣特群經音辯云取於人曰貸與之曰貸監河侯說苑作魏文侯也將貸他代切與之也而呼火故切大聲也鮒魚音附廣雅云鰿魚也鰿音迹波臣司馬云謂波蕩之臣南游說見張君房本舊闕激古狄切西江成云蜀江也蜀江從西來故謂西江吾失我常與與猶親也謂魚水常相親也卑索所白切枯魚李云猶乾魚也趣遠任公子李云任國名也大鉤本亦作鉤巨緇司馬云大黑綸也犗古邁切犍牛也謂峰領牛也餌音二蹲音存成云踞坐也會古外切稽古兮切山名今爲郡也期年本亦作期音基言必乆其事後乃能感也錎没音陷驚揚一本作驚奮鬐求夷切李音須憚丹未切赫火百切千里言千里皆懼若魚司魚云大魚名也若海神也或云若魚猶言此魚而腊音昔制河本亦作浙諸設切河亦江也北人名水皆曰河浙江以爲吴會界分司馬云浙江今在會稽錢塘蒼梧或云山名在嶺南或云九疑山也輇才才金切李云輇量人才也或作軨軨小也本又作輕諷說方鳳切揭其列其竭二切竿累劣彼切竿累謂荆篠之竿繭絲之綸類累綸也灌瀆司馬云溉灌之瀆守鯢五兮切鮒音附李云鯢鮒皆小魚也縣令縣高也令譽也迹弊臚力於切蘇林注漢書云上傳語告下曰臚臚猶行也傳治戀切向云從上語下曰臚傳一音張戀切遽也東方作矣司馬云謂日將出也裙襦而朱切青青之麥司馬云此逸詩刺死人也陵陂彼宜切布施始豉切接持也成云撮也壓乃協切字林云擪一指按也其顪本亦作噦許穢切司馬云頤下毛也成云顪口也金椎直追切控苦江切成云打也徐别彼列切分開也矜驚老萊子楚之高士也常隱蒙山楚王召而不應與妻逃於江南其知所之出拾薪江南本作出拾薪本又作出採薪舊作出薪趨下音促李云下短也末僂謂頭前背傴也後耳司馬云耳却後也視若營四海夫勞形役智以應世務失其自然者也故堯有亢龍之喻舜有卷僂之談周公類之走狼仲尼比之逸狗豈不信哉丘去超吕切躬矜爲身矜修善行容智謂飾智爲容好蹙然子六切業可得進乎問可行仁義於世乎而驁五報切矜也下同下或作鶩窶其矩切之行下孟切易進焉耳易見張君房本舊闕反无非傷也反逆於理動无非邪也似嗟切動矜於是也聖人躊音疇躇直居切以興事以每成功每者每有成功也躊躇者從容興事雖有成功聖人不存猶致弊迹流毒百世況乎矜善行而載之不已哉智困宋元君李云元公也按元公名佐平公之子史記作宋元三二年夢見龜阿門司馬云阿屈曲簷也宰路李云淵名龜所居處予爲如字又于僞切使河所吏切漁者音魚余音預且子餘切史記云姓余名且於泉陽得龜覺古孝切占之史記云占者博士衛平令力成切會朝直遥切下同刳口孤切七十二鑽左端切而无遺莢初革切龜卜七十二兆而无遺失關氏易傳云故七十二爲經此所以立曆法也五之爲期五箇七十二成歲七百二十爲起法七千二百爲統法七十二萬爲通法氣朔之下收分必盡爲全率七千二百萬爲大率謂之元紀鵜徒兮切鶘音胡水鳥也一名淘河去小起吕切下同石師石者匠名也謂无人爲師匠教之者也一本作所師又作碩師无用之用厠足音側謂足之側也墊丁念切崔云下也致黄泉致至也謂人從足之側握之墊下至于黄泉流遁之行下孟切任與音餘覆墜直類切狶韋氏虚豈切古帝王不波波者高下貌文云波蕩物性也不僻匹亦切内通顫舒廷切謂審於氣臭哽庚猛切塞也跈女展切踐也其竇音豆穴也胞並交切腹中胎也說文生兒裹也重直龍切閬音浪郭云空曠也勃谿音奚勃爭也谿空也司馬云勃谿反戾也室无空虚以容其私則反戾共鬥爭也六鑿在報切相攘如羊切郭云逆也司馬云謂六倩攘奪也大林丘山之善句絶於人也亦神者不勝茂林爲丘凶之美茂林伐則炁象損焉奇才爲士人之善寄才役則精神眊馬誸音賢郭云急也向云堅正急則計生柴說文小木散材也徐鉉四師行野次立散木爲區落名曰柴籬郭云塞也銚七遥切削也鎒乃豆切似鉏田具也到植時力切又音值立也司馬云鉏拔反之更生者曰到植眥子斯子智二切本亦作揃子淺切三蒼云揃猶翦也𡟬本作搣音滅字林云批也史崇藏經音義云搣手拔也可以沐老老則目角皮皺也搣㧗也令使手批皺平可以洗老容謂摩拭赤宅也一本作休老非佚音逸以駴户楷切王云謂改百姓之視聽也徐音戒謂上不問下也遠眞演門似淺切成云宋城門名一云楚邑名官師楚官名蕩性務光紀他徒河切並解大宗師篇而踆音存古蹲字窾水音款水名吊之司馬云恐其自沈故吊之申徒狄已解大宗師篇踣音赴本亦作趨字林云僵也李云頓也忘荃荃七全切崔音孫苔草也可以餌魚或云積柴水中使魚依而食焉一云魚苟也蹏大兮切兔罥也又云兔弶也係其脚故曰蹏也罥古縣切弶巨亮切得夫音符南華眞經章句音義卷之十三
