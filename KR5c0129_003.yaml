front:
  text: 南華真經章句音義卷之三習三
  hash: sha256:ef61b397751df42c748706f66666b24e78e3f0920410d64d19bd1151706f1c73
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5c0129_HFL_003-001a, image: hfl/0495/0495-058.png}
body:
  text: 碧虛子造內篇人間世四化導顔回史記云字子淵魯人也年二十九髮盡白蚤死仲尼史記云姓孔名丘字仲尼魯人湯之後生衰周之世有大聖之德回之師也衛君司馬云衛莊公蒯聵也按左傳衛莊公以魯哀公十五年冬始入國時顔回已死不得為莊公蓋是出公輒也行下孟切獨崔云自專也國量音亮若蕉似遙切蕉不堅之草言德澤虛美也醫於其切思其所行則庶幾其國有瘳乎丑由切愈也所行見江南李氏本舊闕嘻音熙歎聲也若往而殆刑耳見張君房本舊作若殆往而刑耳所為子偽切相軋於黠切輾轢也車所踐也信矼苦江切簡文云慤實貌強其兩切衒熒絹切賣也見江南古藏本舊作術人惡烏路切下惡不肖同有其美也崔本作人惡育云賣也與上衒賣義相貫矣災音災下同災夫音抉惡用音烏若唯無詔句絶告也言也其捷在接切熒之户扁切桀史記云諡法賊民多殺曰桀關龍逄成云桀之賢臣盡誠而遭斬首紂史記云諡法殘義損善曰紂王子比干成云紂之叔父忠諫而被剖心拊音撫李云傴拊謂愛憐之也下拂符弗切違戾也以擠子計切排也是好呼報切叢支才公切胥敖解在齊物篇有扈音户司馬云國名在始平郡按即今京兆鄠縣也虛厲如字又音墟居宅無人曰虛死而無後曰厲語我魚據切下同告也惡惡音烏未允聲也下同容與成云放縱也文云自恣其情也不訾音紫毁也蘄乎音析擎其驚切跽其里切擎拱手也跽跟跪也曲拳音權禮容貌無疵才斯切病也謫之陟革切罰也不諜徒協切軍中反間曰諜師心自信成心也有心而為之其易邪心一之見張君房本舊作有而為其易邪皡天胡老切皡明也不宜説文宜者所安也不茹音汝食也葷許云切辛菜也未始得使句絶謂未曾得使虛心而的有此身也其樊區域也闋者苦穴切空也生白白者陽明也吉祥止止吉祥道也夫虛靜絶念則道集矣坐馳形坐而心馳也夫徇辭俊切李云使也所紐女九切系也成云綱紐也伏羲許宜切即太皡三皇之始也几蘧其居切向云古之帝王也散焉悉旦切李云放也崔云德不及聖王為散命使葉公音攝文云姓沈名諸梁字子高楚莊王之遠孫沈尹戍之子為楚大夫食采於葉僣稱公時北狄伐楚楚昭王懼使子高求救於齊將使所吏切下待使同將命者也王使音史役也令也栗之音栗李云懼也常語魚據切下同寡不道以歡成江南古藏本作寡有不道以成歡執粗音粗糯也不臧作郎切善也爨七亂切欲清七性切字宜從清從清者假借也清涼也熱與音餘下慎與同以任而林切哀樂音洛下同不易如字移也又以豉切云輕易也而惡烏路切下同乎諒誠信也喪息浪切下同易以以豉切下同偏辭音篇崔本作諞音辨氣息茀然符弗切崔音勃心厲如字李音賴刻核幸格切漢書宣帝傳云綜核名實于吉太平經有核事篇古人以核作劾通用師傳顔闔胡臘切崔本作盧魯之賢人隱者也先事魯定公後適衛為靈公太子師傅靈公左傳云名元諡法亂而不損曰靈太子司馬云蒯聵也後為莊公蘧其居切伯玉名瑗字伯玉衛之賢大夫也天殺天然好殺為德無方李云方道也為蹶其月切敗也為祅於喬切地反物為祅為孽魚列切災也或作孽嬰兒崔云喻驕遊也無町徒頂切畦户圭切李云町畦畔埒也無威儀貌無崖文云無禮法也無疵似移切病也螳蜋音堂郎有命斧之蟲勝任並平聲幾矣文本作幾殆矣為其于偽切下同媚養成云順則悅媚可以馴狎盛音成下同矢或作屎同以市軫切蛤類溺奴弔切劉得一作尿從尾從水蚊音文虻孟庚切僕緣普木切向云僕僕然蚉虻緣焉稠穊貌崔音如字云僕御也而拊音撫不材惡名匠石匠是工人之通稱石乃名也曲轅音袁曲轅道名也櫟力狄切不材之木也社封土曰社土吐也云能吐生萬物故謂之社其大蔽必世切數千牛見張君房成玄英文如海本舊闕潔奚結切集韻云潔束知其小大也顔師古注漢書云潔繞也百圍李云徑尺為圍蓋十丈也十仞七尺曰仞觀者音官下同匠伯伯長也為衆匠之長也不輟丁岉切厭於艷切散木悉旦切木以不材為散速腐奉斧切爛也液音亦樠亡言莫千二切司馬云液津液也謂脂出樠樠然也崔云黑液出也蠹丁故切見夢胡薦切惡乎音烏下同文木謂才之美也櫨梨側加切橘均必切柚余救切果蓏力果切木子曰果草子曰蓏泄思列切萎泄在地也苦其崔本作枯掊普口切擊也而幾死之散人句絶又惡知散木匠石以不材為散木櫟社以材能為無用故謂匠石為散人也覺古孝切而診直信切占夢也詬呼豆切厲如字詬辱也厲病也且幾音機近也翦乎子淺切伐也神不矜能南伯子綦即齊物篇南郭子也伯長也商之丘司馬云今梁國睢陽縣是也千乘駟馬曰乘將隱芘其所藾見張君房本舊作隱將芘其所籟材夫音扶拳曲音權軸直竹切解如衣軸之直解也咶食紙切嗅許救切狂酲音呈病酒曰酲材致不祥荆氏司馬云地名一旦里名宋國有荆氏之地宜揪柙桑宜此三文木也拱恭勇切把百雅切司馬云兩手曰拱一手曰把狙七餘切猴音侯獼猴也之杙以職切成云杆橛也以繫杆獼猴也司馬本作扒音八云欲以栖戲狙猴崔本作拔音跋云枷也三圍徑尺曰圍之麗如字屋㮩也求禪音膳傍薄剛切司馬云棺之全一邊者謂之禪傍故解古賣佳買二切祓除也祭鬼也顙息黨切頌也亢鼻苦葬切司馬云高也頞折故鼻高又仰也痔直里切適河司馬云謂沈人於河祭也西門豹為鄴令方斷之疏德養身支離疏成云四支離坼百體寬疏因以為名頤以之切於頂司馬云脊曲頸縮也淮南子云脊管高於頂也會古外古活二切撮子外子活二切指天司馬云會撮髻也古者髻在項中脊曲頸低故髻指天也五管在上李云管腧也五藏之腧皆在上也兩髀音陛崔云僂人腹在髀裏也為脅許劫切司馬云脊曲髀立故與脅並也挫寸卧切摧也針執金切司馬云挫針縫衣也治繲音懈故衣也謂補衲舊衣也糊口音胡食也鼓策初革切崔云鼓策揲蓍也播精崔云卜卦占兆也以食音嗣攘如羊切三鍾司馬云六斛四斗曰鍾有用致患孔子適楚史記云孔子圍於陳蔡楚昭王興師迎孔子孔子適楚僅音覲才也畫地音獲郤曲郤曲乞約切退也謂退身曲全也郤曲郤曲見張君房本舊作吾行郤曲轉寫誤也郤音乞逆切今不取內篇德充符五鑑道兀者五忽切刖足曰兀王駘臺殆二音魯人未見傳記從之如字李才用切下同常季仲尼弟子丘也直後而未往耳直在駘後未得往師之耳而王于况切盛也勝也其與庸亦遠矣仲尼自伏庸下不亦太甚地覆芳服切墜直類切而守其宗者也見江南藏本舊闕肝膽丁覽切所喪息浪切下同最之徂會切聚也鑑古暫切流水崔本作沫水受命於地唯松柏獨也正在冬夏青青受命於天唯堯舜獨也正在萬物之首見張君房本舊闕保始之徵李云徵成也終始可保成也九軍李天子六軍諸侯三軍通為九軍簡文云兵書以攻九天收九地故謂之九軍也自要一遙切六骸身首四支也假人古雅切遊內申徒嘉成云鄭之賢人姓申徒名嘉兀足者也子産姓公孫名喬字子産鄭之賢相也無人即伯昏瞀人也古有道之士列子嘗師之不足以自反邪張君房本無不字羿音詣堯時善射人彀音遘張弓也中郭云弓矢所及為彀中中地丁仲切下不中同怫然扶弗切暴怒貌不知先生之洗我以善邪吾之自寤邪見張君房本舊闕子索色百切蹴然子六切驚慙貌乃稱如字舉也務全叔山無趾音止李云叔山字也無足趾也踵朱勇切向云頻也崔云無趾故踵行見賢遍切子不謹前句絶前行下孟切語魚據切孔丘之於至人其未邪張君房本無其字賔賔中外無主貌蘄音析諔尺叔切詭九委切諔詭奇異也幻滑辦切桎之石切木在足也梏古毒切木在手也德平魯哀公定公子名將惡人醜貌哀駘臺殆二音它徒何切李云哀駘醜貌它其名衛國之士也常和户卧切下同惡駭胡楷切雌雄李云禽獸屬也期年音基匝四時曰期傳國大專切悶然音門李云不覺貌泛若浮劍切不係也醜乎自可惡也崔本作愧無幾居豈切俄頃也與樂音洛常使所吏切一本作遊豚子徒門切與豚同食音飲成云謂飲其乳也少許照切少頃也眴若本亦作瞬音舜崔云目動也謂死母眴曰若少頃之間也翣資所甲切成云飾武之具武王所造形似方扇翣以木為衣以白布畫為雲氣如今之攝也俠車兩邊將軍行師陷軍而死及其葬日不用翣資資送也之屨俱遇切復也取妻七句切以滑音骨於兊徒外切悅也無郤去逆切間也能離力智切閔子史記云名損字子騫魯人仲尼弟子在四科之數不仕大夫不食汙君之祿甚有孝行德忘闉音因跂音企支離無賑市軫切闉曲也跂不正也闉跂支離言腳常曲行體不正卷縮也無賑名也又闉跂偃者也跂行也賑臀也説始鋭切下同衛靈公已出人間世篇脰音豆頸也肩肩胡田切李云羸小貌甕烏送切盎烏葬切李云甕盎大癭貌大癭一領切瘤也齊桓公史記云襄公庶子小白也諡法辟上兼國曰桓為孽魚列切惡用音烏下同不斫陟角切雕斫也無喪息浪切天鬻音育養也天食音嗣亦如字受食如字又音嗣無情眇亡小切眇乎謙小貌謷牛刀切謷乎夸大貌惡得音烏下同好惡呼報烏路二切倚於綺切稿苦老切梧音吾而暝音眠成云稿梧乃夾膝几也惠子好談名理行則倚木而吟坐則憑几而睡天選宣轉息戀二切授也與也任也鳴無理之言謂之鳴南華真經章句音義卷之三
