front:
  text: 南華真經章句音義卷之十二習十二
  hash: sha256:500ea67f27a64d92419778d5a3a833e79dc8b3f72187a090d27820f620f7e561
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5c0129_HFL_012-001a, image: hfl/0496/0496-094.png}
body:
  text: 碧虛子造雜篇徐無鬼二十八遷善徐無鬼緍山人魏之隱士司馬本作緍山人徐無鬼女商成云魏之幸臣魏武侯名擊文侯子治安邑勞之力報切唯山林之勞一字如字餘並下章並力報切盈嗜時志切下同長丁丈切好呼報切下章同惡烏路切下章同黜敕律切退也掔苦田切爾雅云固也崔云引去也司馬云牽也超然司馬云猶悵然也少焉詩照切嘗語魚據切吾相息亮切下同執飽而止成云執守情志唯貪飽食是狸德也謂貪如狐狸也視日司馬云瞻遠也若忘其一一身也謂精神不動若無其身也直者中繩丁仲切下同司馬云直謂馬齒曲謂背上方謂頭圓謂目成云曲謂項也成材言自然已足不須教習也若恤音恤文云疾也若失音逸文云亡也李云恤失皆驚竦若飛也若喪息浪切下章同其一言喪其偶也超軼音逸過也徐徒列切崔云徹也從說子容切金板或曰祕讖也司馬云周書篇名六韜吐刀切謂太公六韜文武虎豹龍犬也越之流人司馬云越國流人有罪見流徒者也又越遠也數日所主切期年音基逃虛空者司馬云故壞冢處為虛空也成云虛園空宅也藜力西切藋徒吊切柱誅矩切司馬云塞也宇見君房本舊作乎鼪音生鼬由救切之徑司馬本作徑道也跟位其空音良跟云欲行貌司馬本作良云良人謂巡虛者也位其空謂處虛空之間也聞人足音跫然巨恭切踏地聲成云人行之聲而喜矣李云喻武侯無君人之德而處在防衛之間雖臨朝矯厲愈非其意及得其所思猶逃竄之人聞人足音安能不跫然改貌釋然而喜矣謦苦項切咳苦愛切李云磬咳喻言笑也但呼聞所好猶大悅況骨肉之情歡之至也久矣夫音扶後倣此修誠食茅音序葱韭音久以賔本作擯必刃切司馬云棄也李云賔客之賔欲干李云干求也社稷之福邪李云謂善言嘉謀可以利社稷也萬乘繩證切不自許司馬云許與也謂自私之姦也姦病王云姦者以正從邪謂病也偃兵偃息也鶴列李云謂兵如鶴之列行司馬云鶴列鍾鼓也文云陳形也麗譙本作噍在逍切司馬云麗譙樓觀名也按謂華麗而嶕嶢也文云戰樓也徒驥司馬云徒步卒也文云驥馬軍也錙壇側其切錙壇壇名成云宫名也文云戰場也惡乎音烏勿攖一營切又一盈切已脫音奪肉去骨也他括切骨去肉也此非也放心大隗王罪切成云古之至人具茨把咨切司馬本作疚山名在熒陽密縣東今名泰隗山昌㝢音禹驂乘繩證切驂乘車右也御車左也謵音習朋蒲登切崔本作㞔舒氏切前馬司馬云二人先馬導也昆閽音昏滑音骨稽音雞後車司馬云二人從車後也襄城之野今汝州有襄城縣在大隗山之南七聖黃帝一方明二昌㝢三張若四謵朋五昆閽六滑稽七豫少詩召切瞀莫豆切李云風眩貌司馬讀曰𥈆謂眩𥈆也長者丁丈切乘日之車司馬云以日為車謂乘日新以變化也車者推移不定也少痊七全切李云除也且復扶又切亦去起吕切樂囿不樂音洛下同察士李云察識也成云機警明察之士也陵李云謂相陵轢誶音信廣雅云問也又雖遂切謂好陵辱責罵人也之辭見張君房本舊作淩誶之事皆囿音又文云滯於一方也興朝直遙切中民之士李云善治民者也矜難乃旦切枯槁苦老切後章同宿名宿久積也王云枯槁一生以為娛其所寢宿唯名而已廣治直吏切貴際謂盟會事不比毗志切成云比和樂也下同商賈音古學以居位曰士闕土殖穀曰農作巧成器曰工通財鬻貨曰商一云坐賣售曰賈市井古者因井為市故謂之市井則壯壯猶勤也謬妄而中丁仲切儒墨楊秉成云儒姓鄭名緩墨名翟楊楊來也秉公孫龍子魯遽音渠成云周初時人冬爨七亂切鼎成云冬取十年燥灰以擁火須臾出火可以爨鼎夏造冰成云盛夏以瓦瓶盛老湯再煮極沸沈瓶井底即自成冰為之于僞切廢一廢置也改調徒吊切無當丁浪切合也方與我辨江南本作方與我辨奮本作方與我以辨相拂以辭扶弗切文云拂反也相鎮以聲文云鎮壓也齊人蹢子於宋音擲投也司馬云齊人憎其子蹢之於宋使門者守之今形不全自以為是鈃鍾音刑字林云鈃似小鍾而長頸又云似一而大以束縛郭云恐其破傷也按此言賤子貴鈃自以為是也唐子謂失亡子也遺類遺亡也亡其種類故也惠施叛道而好辨猶齊人遠子而愛鍾也未始離力智切於岑士金切岑岸也成云楚郢之人因寄于江濱之側投蹢守門之家夜半無人之時輒上人舟而舟未離岸反與舟人鬥愧心負理更造怨詞迷謬若此自以為是亡質從者才用切郢人以井切楚都也漢書音義作懮人古之善塗塈者施廣領大袖以仰塗塈而領袖不汙有小飛泥誤著其鼻因今匠石揮斤而斫之懮音溫堊烏洛切白土也漫莫干切李云塗也暝目恣手四字江南本是經舊本作郭象注非是試為于僞切公舉可不謂云江南李氏本作諱舊本作謂大病大極也惡乎音烏屬音燭欲與如字又音餘且鉤鉤反也上忘而下畔言在上不自高於下無背者也以聖臨人以賢下人江南本作以聖臨人以賢下人舊本並作以賢戒驕狙七徐切吳王文云夫差也恂然舜荀二音司馬云遽也成云怖懼也深纂側巾仕巾二切成云林叢也委於危切蛇餘支切成云從容也攫俱縛切三蒼云攫搏也搔素報切文云勝躑便疾貌見賢遍切王射食亦切下同搏音博捷疾葉切速也相者息亮切司馬云佐王獵者也趨射音促急也狙執死司馬云見執而死也之狙之猶是也其便婢面切以敖音傲慢也此殛紀力切誅也董梧有道之士師其德以鋤色以鋤士居切成云除去也去起吕切樂音洛鬻名隱几於靳切噓音虛入見賢遍切山穴之口李云齊南山穴也司馬本作山穴之中田禾齊君也尊德故國人慶之鬻之羊六切彼惡音烏下同自喪息浪切貴默觴之音商李云酒器之總名也孫叔敖執爵按左傳孫叔敖是楚莊王相孔子未生魯哀公十六年仲尼卒後白公為亂宜僚未嘗仕楚又宣公十二年傳云楚有熊宜僚則與叔敖同時去孔子甚遠蓋寄言也成云爵亦酒器受一升於此言已文云謂古人於會同之處酹祭之時祝辭也弄丸丸猶珠也弄丸者謂轉丸之技也宜僚視天下事若轉丸於掌中聊以自適也鬼谷子有轉丸法猛獸夫聖智之無窮若轉丸之無止類獸威之無盡故宜僚所以示弄丸之技也而兩家之難乃旦切解音蟹司馬云宜僚楚之勇士也善弄丸楚白公勝將作亂殺令尹子西子期石乞曰市南有熊宜僚者若得之可以當五百人乃往告之不許也承之以劍不動弄丸如故曰吾亦不泄子白公遂殺子西子期歎息兩家而已宜僚不預其患文云白公勝及大夫子西兩家舉兵相伐二家大夫曰宜僚陸沈之士一人當五百並遣使往召之宜僚高枕安卧以見二大夫之使者以兩乎弄丸不止眠復不起承之以劍不動二大夫使者各還具論宜僚之意二大夫曰高枕而卧者示我無為也承之以劍不動者兵不足恃也兩手者喻兩家也丸者形園無為之物也兩手弄之不止者俱至於困也明兩家構兵不止必至滅亡二大夫解兵而歸不復用兵也甘寢秉羽如字謂以扇掩面也司馬本作凳云讀曰翮或作翅雩舞者之所執崔本作翼郢人投兵司馬云言叔敖願安寢恬卧以養德於廟堂之上折衝於千里之外敵國不敢犯郢人投兵無所攻伐也喙許穢切三尺三尺言長也司馬云喙息也宜僚弄丸而弭難叔敖除借以折衝丘亦願有歎息其三尺三尺七首剱也成云喙口也苟其言當即此無言假令喙長三尺與閉口何異故願有之彼之謂彼謂宜僚叔敖一曰彼謂甘寢此之謂此謂仲尼也一曰此謂弄丸總音總不能同一本作相同善吠伐廢切司馬云不别客主止也善言司馬云失本逐末而言不止循古而不摩一本作磨郭云摩拭也王云摩消滅也雖常通物而不失己雖理於今當循於古之道焉自古及今其名不摩滅也相形九方歅音因善相馬人淮南子作九方皋為我于僞切相吾子息亮切捆音困瞿然紀俱切司馬云喜貌字林云大視也索然悉各切司馬云涕下貌禦福魚吕切距也逆也而牂音滅爾雅云牝羊也於奧烏報切西南隅未地羊之位也一曰豕牢也好田呼報切於宎一作窔烏吊切東北隅也一云東南隅火地火地生鶉也一曰東南辰地辰為鶉鳥也游於天地也見江南古藏本舊闕邀古堯切遇地樂音洛委於危切蛇餘支切之償辰羊時亮二切還也怪行下孟切無幾居豈切於燕音煙而鬻音育易以豉切刖音月渠公渠公齊之富室為街正買梱自代終身食肉至死一云渠公屠者與梱為君臣同食肉也外賢畜畜李云行仁貌王云恤愛勸勞貌其人與人相食與音餘言將馳走於仁義不復營農飢則相食所惡烏路切之行下孟切且假夫禽貪者器司馬云禽之貪者殺害無極仁義貪者傷害無窮且假夫仁義為禽貪之器用也一覕簿結切說文蔽不相見也偷安暖吁爰切桑貌姝音樞說文曰好佳也又暖姝自許貌濡音儒安也需音須濡雲謂偷安濡潤須臾之頃卷音權婁音縷卷妻猶拘攣也言拘檢求名之人屈己以殉物物雖懷歸終當自苦如舜登庸歷試以至己身臞臘招損之由超於羶行耳豕蝨音瑟疏鬛長毛見張君房本舊閼奎蹄苦圭切奎說文兩髀之間也曲隈烏回切股間也操煙七曹切羊肉不慕蟻魚綺切云舜年長心勞無愛樂之志是猶羊肉不慕蟻也羶也設然切羶行下孟切三徙成都一年所居成聚二年成邑三年成都也至鄧之墟邑名童土云童土地無草木也齒長丁丈切惡衆烏路切不比毗忘切下同和也煬音羊和煬炙也為和氣所炙於蟻棄智於魚得計於羊棄意蟻得水則死魚得水則生羊得水則病一云真人無羶故不致蟻是蟻棄智也共處相忘之大道無沾需之德是魚行計也羊無羶行而不致蟻是羊棄意也自晦以天待人見張君房本舊作之堇音謹司馬云烏頭也治風冷痺桔梗音結古猛切司馬云桔梗治心腹血瘀瘕痺雞壅於容切司馬云雞頭也一名芡與藕子合為散服之延年本或作㿈豕零司馬本作豕囊一名猪苓根似猪卵可以治渴案四者皆藥草名是時為帝者也司馬云藥草有時迭相為帝謂其王相休廢各得所用也勝言音升句踐音鉤越王甲楯純尹切楯云扞身蔽目者棲於音丙李云登山曰棲會古外切稽音難種章勇切越大夫名也吳越春秋云姓文字少禽所以存一本作可以存言知越雖亡可以存也鴟尺夷切目成云鴟目書暗而夜開則適夜而不適晝鶴脛刑定切解之佳買切司馬云去也成云鶴脛禀分而長則能長不能短枝節如此故解去則悲亦猶種暗於謀身長於存國也有損焉有形自然相纍世能纍物物能纍人故大夫種有以不免也恃源而往者也水由源往雖遇風日不能損也道成其性雖在於世不能移也之長丁丈切兹萃聚也李云多也恃其所不蹍女展切李云一足常不移故能行廣遠也棄數解之音蟹下同又佳買切頡下結切滑乎八切頡滑謂錯亂也揚榷音角三蒼云榷敵也許慎云揚榷粗略法度王云榷略而揚顯之惑解佳買切復於音服南華真經章句音義卷之十二
