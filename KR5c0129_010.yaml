front:
  text: 南華真經章句音義卷之十習十
  hash: sha256:173952c42bede1439395ad1c123200b8e52a6bc827944bade84fdff618743e7d
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5c0129_HFL_010-001a, image: hfl/0496/0496-054.png}
body:
  text: 碧虛子造雜篇田子方二十五真寤田子方李云魏文侯師也名無擇數稱音朔下同溪工李云溪工賢人也東郭順子成云居於郭東因以為氏名順子于方之師葆真音保儻然敕蕩切司馬云失志貌而語魚據切之行下孟切形解户真切口鉗其美切土梗更猛切土苴也司馬云土人也遭兩則壞冥會溫伯雪子李云南國賢人成云楚之賢人魯人成云謂孔子門人也中國成云魯國也陋成云拙也蘄音析振成云動也從容七容切文云規矩禮義也龍虎威嚴也其道江南古藏本作導夫人音符目擊而道存矣司馬云見其目動而神實已著也擊動也又云目裁往意已達密移瞪若敕庚切字林云直視貌不比吡志切親比也滔乎前吐刀切謂無人君之器滔聚其前也惡可音烏察與音餘下哀與同有目有趾文云有情之類薰然許云類冲氣薰蒸貌汝殆著乎吾所以著也張慮切見也司馬云吾所以著者外化也汝殆庶於此耳吾一不化者則非汝所及也是求馬於唐肆也郭云唐肆非停馬處也又磨停也司馬本作廣肆云廣庭也求馬於市肆廣庭非其所也才德自然被髮皮寄切而乾本或作干慹然乃牒切司馬云不動貌少焉詩照切見曰賢遍切眩音縣與音餘下同掘若徐音兀槁木苦老切離人力智切口辟必亦切司馬云辟卷不開也又婢亦切成云口開不合也嘗為于僞切至樂音洛下同行小下孟切又如字胸次李云次中也能滑古沒切得喪息浪切所介音界解乎音蟹又户實切於汋音汋李以略切挹取也醯雞許西切郭云甕中之蠛蠓也踐言魯哀公司馬云莊子與魏惠王齊威王同時在哀公後百二十年成云此寓言也冠古亂切圜冠音圓履句音矩李云方也屨居具切緩户管切司馬本作綬佩玦音决成云綬者五色條繩穿玉玦以飾佩也又云本亦作緩者曳綬佩玦以其事到而决斷也或謂玞如環而有缺逐臣賜玦義取與之决别也斷丁亂切不號號合也內得外豐百里奚爵祿不入於心故飯牛而牛肥史記云晋獻公滅虞虢虜虞君與其大夫百里奚以為秦繆公夫人媵於秦百里奚止秦走宛楚鄙人執之繆公聞百里奚賢欲重贖之恐楚人不與乃使人謂楚曰吾媵臣百里奚在焉請以五羖羊皮贖之楚人遂許與之當是時百里奚年己七十餘繆公釋其囚與語國事謝曰臣亡國之臣何足問繆公曰虞公不用子故亡非子罪也固問三日繆公大說授之國政號曰五羖大夫百里奚謝曰臣不及臣友蹇叔蹇叔實而世莫知臣嘗游困於齊而乞食䬹人蹇叔收臣臣因而欲事齊君無知蹇叔止臣臣得脫齊難遂之周周王子頽好牛臣以飬牛干之及頽欲用臣蹇叔止臣臣去得不誅事虞君蹇叔止臣臣知虞君不用臣臣誠私利祿爵且留再用其言得脫一不用及虞君難是以知其賢於是繆公使人厚幣迎蹇叔以為上大夫䬹音窒地名一曰刈禾人通作銍忘其賤與之政也謂忘其飯牛之賤也有虞氏舜事親至孝死生不入於胸中名聞天下感動人主藝精忘形受揖而立司馬云受命揖而立也䑛食紙切儃儃音坦李云舒間貌槃礴傍各切司馬云箕坐也羸力果切司馬云將畫故解衣而見形詢衆任賢文王觀於臧成云臧者近渭水地名也丈人者寓言於太公也司馬本作文王微服而觀於臧而屬音燭𩑺而占切成云文王父季黑色多𩑺駁馬邦角切偏朱蹄李云一蹄偏赤也瘳乎敕留切成云差也蹴然子六切先君王也司馬云言先君王靈神之所致王其無它司馬云無違也列士壞音怪下同植音值散羣司馬云植行列也散羣言不養徒衆也一云植者彊界頭造屋以待諫者也長丁大切下同官者不成德司馬云不利功名也斔斛音庾李云六斛四斗曰斔十斗曰斛昧然音妹泛然敷劍切夜遁塗困切功成事遂韜光退身故曰夜遁刺焉七賜切有心未妙御寇為于僞切盈貫古亂切司馬云鏑也文云盈貫謂過鏑也適矢丁歷切親也復沓扶又切下同成云沓重也象人成云木偶人又土梗人也逡巡七旬切成云却行也汗流户旦切揮斥音尺郭云揮斥猶放縱也怵然敕律切有恂音荀爾雅云恂栗也目之志怐謂眩也欲以眩悅人之目故怵然也於中丁仲切道充不動肩吾成云隱士也孫叔敖楚之賢大夫栩栩然况甫切自得貌又欣暢也躊直留切躇直於切成云逸豫自得也四顧成云高視八方也得劫居業切彊取也伏戲音羲無介音界說文畫也一曰聞也不憊皮拜切冶身保存楚王成云楚文王與凡僖侯同坐論合從會盟之事楚有吞夷之意故使左右以言感之凡君司馬云凡國名在汲郡共縣按左傳凡是周公之後雜篇知北游二十六冲默知如字舊音智今不取北游於玄水之上司馬本作玄水之北隱弅符云切成云隱則深遠難知弅則鬱然可見白水之南成云白是潔素之色南是顯明之方狐闋苦穴切李云丘名狐者疑也闋者息也而睹丁古切狂屈狂妄也屈曲也之言司馬云之是也唉哀在切李云應聲也語若魚據切其易以豉切所惡烏路切通天地之一氣耳地之見劉得一本舊作通天下一氣耳大美謂覆載之美也合彼見劉得一本舊作今扁然音篇成云遍生貌文本作翩然云日新貌未離力智切其內謂不能出自化也惛然音昏昧也張君房本作𠉣油然音由謂無所給惜也成云無係貌神解被衣如字又音披瞳焉敕紅切不瞬貌如新生之犢李云未有知貌若槁苦老切媒媒音昧晦晦音誨媒媒晦晦無心貌又冥昧貌常道丞古有四輔左輔右弼前疑後丞蓋官名也或作蒸李云舜師也有夫音符委形說文已也子孫見張君房本舊作孫子委蛇吐卧切天地之彊陽氣也郭云彊陽猶運動耳案言天地尚運動況氣聚之生何可得執而留也可道晏於諫切疏瀹音藥漬也成云洗濯也澡雪成云精潔也文云靜精神也掊擊而智普口切成云打破也文云棄智也窅然鳥了切將為于僞切無形謂太初也精神生於道謂常道也九竅苦弔切皇皇文云無際貌邀於古堯切成云遇也此者此者冲妙之道也恂達須倫切說文信心也一曰均也天不得不高謂天不得此道不能為高也道與音餘下同博之不必知辨之不必慧成云博通經典未必知真宏辨飾辭不必慧照也以斷端管切成云棄也巍巍魚威切成云高大之稱運量萬物而不遺夷佳切亡也又餘也見劉得一本舊作匱萬物皆往資焉而不匱求位切中極喑音暗與蔭同醷隱紀切郭云喑醷聚氣貌幾何居豈切果蓏力果切文云木子曰果草子曰蓏白駒文云曰光也成云駿馬也過郤去遙切成云郤乳也注然勃然步忽切成云注勃出生之容油然漻然音流成云油漻入死之狀天韜敕刀切成云韜囊藏也墮其許規切天袠陳筆切成云袠裹束也紛乎宛乎於院切成云紛綸宛轉並釋散貌道無不在東郭子李云居于東郭也田子方之師惡乎音烏螻力侯切蟻魚綺切稊大西切稗蒲賣切草名瓦甓步歷切云瓴甓甎也屎尸㫖切溺乃弔切正獲之間於監古銜切市履狶虛豈切每下愈况李云正亭卒也今之市令也獲其名也監市市魁也狶大豕也履踐也夫市魁履其豕股腳縣蹄之下肥則知上肥矣問道亦況下賤則知道之遍也一曰况益也每履其縣蹄之下難肥之處見其肥則知上之饒益多矣或曰况者意况也汝唯莫必謂無乎逃物見張君房本舊闕無有一際周遍咸文云周無不包也遍無不至也咸無不備也淡而徒暫切寥音遼倣徨音旁皇成云放任貌馮皮冰切閎音宏李云馮閎皆大也郭云虛廓之謂衰殺色界切下同得道秋豪妸於河切荷甘音河成云妸姓也荷甘字也老龍吉李云懷道人也神農成云神農非帝者也隱几於靳切闔户户臘切晝暝音眠奓處野切又音奢司馬云開也嚗然音剝李云放杖聲也僻陋足亦切成云偏僻鄙陋也慢武半切又如字訑徒旦切成云不專謹也已矣夫音符弇音奄缸音剛弔李云姓弇缸名弔體道人也繫焉謂為物所歸投也淵之又淵卭而歎崔本作卭張君房本作仰集韻卬仰同音說文舉也詩瞻卬昊天舊本作中恐寫誤光景都亡窅然烏了切搏之音博守一大馬成云楚之大司馬也捶鉤之纍切江東三魏之間人皆謂鍛為捶也鉤帶也巧與音餘下同而好呼報切以長丁丈切不先物見賢遍切又為于僞切未有子孫而有孫子言其要有由不得無故而有傳世故有子孫不得無子而有孫也如是天地不得先無而今有也有先悉薦切下同合境安化成云安住也之囿音又之圃布五切相𩐎子兮切和也背俗山林與音餘下同皋壤與成云神皋奧壤與我無親見江南古藏本舊闕而樂音洛下同能禦魚吕切齊知才細切又如字南華真經章句音義卷之十
