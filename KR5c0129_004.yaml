front:
  text: 南華真經章句音義卷之四習四
  hash: sha256:c91ec6d55d9a3061ba3a70a065862a9c27f163462eca3100c6db0fa1afa8175e
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5c0129_HFL_004-001a, image: hfl/0495/0495-080.png}
body:
  text: 碧虛子造內篇大宗師六真人行庸詎其庶切庸用也詎何也不暮段乎切謀也不栗音栗不濡而朱切濕也登假更夏切至也其覺古孝切深深內息貌真人之息以踵章勇切踵足跟也故腎脈起於足跟也火在水下故息無所不之衆人之息以喉水火相亢故不寧極其嗌音益郭云咽喉也哇獲媧切崔云結也言咽喉之氣結礙不通也天機淺真水濁則天光昏惡死烏路切不欣音欣喜也不距音巨李云欣出則悅生距入則惡死翛然音蕭成云無係貌顙息黨切額也頯渠追切徐去軌切郭云大朴貌向本作䫥然説文權也淒然七西切暖然音暄徐况晚切故樂音洛行名下孟切狐不偕成云姓狐字不偕或云堯時賢人不受堯禪投河而死務光成云黃帝時人身長七尺耳長七寸又云商時人餌藥養生好鼓琴湯與天下不受乃負石自沈于盧水伯夷叔齊搜神記曰孤竹國有女悅其門下書生飮其墨汁而生子棄豬圈中豬虛之不死其上生一根竹直上與林相交家人以為神便收養之及長有武力後夏后氏列土而封之遂為墨胎氏號曰孤竹君成云遼西孤竹君之二子神農之裔姓默台伯夷名允字公信叔齊名致字公達父死兄弟相謙不肯嗣位聞西伯有道試往觀焉文王崩武王代紂夷齊叩馬而諫武王不從遂隱于河東首陽山采薇而食終餓而死或曰夷齊諡號也諡法曰克教乘義曰夷執正克莊曰齊箕子胥餘成云胥餘箕子名也見尸子又云箕子胥餘沫身為厲被髮佯狂紂之叔父諫紂不從被囚奴戮或云胥餘者伍子胥也諫吳王不從抉目而死沈尸于江又云吳王賜子胥屬鏤之劍自死紀他徒河切成云湯時逸人踆于窾水而死申徒狄商時人負石自投于河解在盜跖篇其觚攻乎切鄉飲酒之爵也一曰觴受三升者謂之觚邴邴音丙簡文云明貌崔乎取狠切向云動貌簡文云遠貌滀乎敕六切簡文云聚也又滯也厲乎厲嚴也崔本作廣云苞羅廣也謷五羔切王云高邁於俗也綽昌略切寬也其卓竹角切獨化之謂泉涸户各切竭也相濡音儒吐沫也以沫音末相忘音亡不遁化大塊苦對切解在齊物篇佚音逸於壑火各切所遁杜本切遷也逃也為樂音洛可勝音升善夭徐廣注史記云夭幼少也張君房本作少詩照切得道妙可傳直專切太極未見氣也六極地數六故曰六極乃陰之極者也先天悉薦切長於丁丈切狶韋氏許豈切司馬云上古帝王名以挈苦結切成云驅馭群品提挈二儀伏戲音羲三皇之君取犧牲以充庖以襲氣母司馬云襲入也氣母元氣之母謂道也又云伏戲入同元氣故稱曰皇維斗李云北斗為天下綱維終古不忒它得切差也謂歷於終始指建為常無有差忒堪壞扶眉切又音胚司馬云神名人面獸身崑崙山名在北海之北馮夷司馬云清泠傳曰華陰潼鄉隄首人也服八石得水仙是謂河伯也大川黃河也肩吾神名太山東嶽也黃帝已出齊物篇玄宫黃帝之後高陽氏也生有靈異得道處于真宫真宫北方宫也禺強音虞山海經云北海之渚有神人面鳥身珥兩青蛇踐兩赤蛇名禺強北極山名西王母西王母傳云西王母者姓緱氏字婉襟九靈太妙龜山金母也乃西華至妙洞陰之極尊戴華勝佩虎章崑崙山穴名曰少廣王母常居焉不復生死故莫知始終或曰蓬髮戴勝虎齒善嘯者此乃王母之使金方白虎之神非王母之真形也彭祖解在逍遙篇五伯夏昆吾商大彭豕韋周齊桓晉文又音霸傳説音悅以相息亮切武丁奄有天下乘東維騎箕尾而比於列星司馬云傅説商相也武丁商王高宗也夢得傅説使求之於天下於陜州河北縣傅巖板築之所而得之相於武丁奄然清泰傅説星精也東維箕斗之間天漢之東維也傅説一星在尾星上言其乘東維騎箕尾之間崔本此下更有其生無父母死登假三年而形遁此言神之無能名者也才道相胥南伯子葵或云即南伯子綦也女偊音禹古之有道女人也年長張丈切孺子如喻切稚子也弱子也惡惡乎音烏未允聲也已解人間世篇後不復出下惡乎音同卜梁倚卜梁姓倚名有才器人也亦易以豉切參曰音三朝徹司馬云朝旦也徹達妙道也故見江南古藏本舊闕殺生者不死戮貪生之賊者身存生生者不生進益生之妄者速死攖寧音嬰謂聖人隨物動靜雖櫻而寧也高誘注吕覽櫻猶戾也副墨謂副二翰墨者典教也自此已下皆寓言耳洛誦灑洛讀誦也膽明見理曰瞻明聶許慎説文附耳小説也謂密相許與也需役音須待也役使也用也待使謂行用也於謳烏侯切頌美盛德也玄冥謂淵幽也冥漠也悟道幽漠也參七南切寥力雕切參承也寥空也謂參承道極也疑始莫知其末始有始也自副墨至淵冥七重方可高參寥廓至疑始九重方入太無難測之鄉大道無始之境矣死生友子祀鴻烈解作子永行年五十四而病傴僂子輿音餘子犁禮兮切子來四人並方外之士為尻苦羔切偉哉韋鬼切向云美也崔云自此至鑑于井皆子祀自説病狀也拘拘音駒司馬云體拘攣不申也曲僂力主切曲腰也發背背骨發露也句俱遇切贅之稅切指天李云句贅項椎也其狀似贅言其上向天也有沴音麗陵亂也跰步舊切躚悉田切旋行不直貌而鑑古暫切嗟乎此子輿亂也汝惡烏路切下同曰亡如字浸子鴆切漸也為彈徒旦切梟户驕切炙章夜切解在齊物篇哀樂音洛縣解音蟹下同無所係也喘喘尺軟切環而繞出叱避昌失切無怛丁達切驚也倚其於綺切鼠肝蟲臂以况微賤也不翅詩智切則捍胡旦切捍抵也鏌鎁音莫邪昔吳人干將為吳王造劍妻名鏌鎁因名雄劍曰干將雌劍曰鏌鎁王子年拾遺記云昆吾山地中多丹鍊石為銅銅色青而利草木皆劍利土亦鋼而精其山有獸大如兔毛色如金食土下之丹石深穴地以為窟亦食銅鐵膽腎皆如鐵其雌者色白如銀昔其國武庫之中兵刃鐵器俱被食盡而封簽依然王令撿其庫穴獵得雙兔一白一黃殺之開其腹而有鐵膽腎方知兵刃之鐵為兔所食王乃召其劍工令鑄其膽腎以為劍一雌一雄號干將者雄號鏌鎁者雌其劍可以切玉斷犀王深寶之大爐力奴切惡乎音烏成然魂交也蘧然音渠形開也覺古孝切相忘友子桑户孟子反子琴張並方外之友相與猶親也撓而小切挑徒了徒堯二切莫然莫無也謂寂爾無言有間俄頃也侍事見張君房本舊作待編曲必連切謂編次辭曲以和琴也李云曲蠶薄也相和胡卧切我猶崔本作獨人猗於宜切辭也是惡音烏下同命之命名也疣音尤決古穴切肒胡亂切潰胡對切端倪音瀝芒然莫剛切無係貌倣薄剛切徨音皇倣徨逍遙皆自得逸豫之名憒憒工內切亂也以觀古亂切示也相造七報切詣也下同相忘音亡下同道術如字邑中道也或音遂言溝遂非是畸人居宜切不偶也而侔於天音謀等也亦從也獨行之人不偶於俗而從於天然也無情死孟孫才李云三桓後名才魯之賢人崔云才或作牛惡知音烏下同如覺古孝切下同駭形崔本作咳云有嬰兒之狀旦宅形為神舍言遷易之速猶旦暮之宅所以乃説文乃象氣之出難也庸詎其庶切下章同而厲厲至也造適造作也獻笑獻陳也及排皮皆切排推也寥天一力雕切謂天之寥寥高遠也一者不二也遊道域意而子李云賢士也資汝資給也為軹之是切辭也語助也是也黥其京切劓魚器切李云毁道德以為仁義不似黥乎破冥同以為是非不似劓乎遙蕩縱散也恣睢許維切自得貌轉徙無係貌又變化貌其藩父煩切區域也盲者一本作眇盲瞽解在逍遙篇以與音豫及也下同黼黻音甫弗白與黑為黼黼似斧形也黑與青為黻黻兩己相背也之觀古亂也無莊之失其美據梁之失其力黃法師疏云無莊古之美人也好莊飾為務遇高丘先生以理誨之遂悟乃遺其莊飾之美據梁古之多力人也力能换梁易柱以力陵物遇羡門子以道教之遂悟乃失勇忮之事爐音盧錘之睡之蘂二切李云錘鴟頭頗口句鐵以吹火也成云爐竈也錘鍛也謂治鍛之義也曰噫音醫歎聲也崔云辭也又作意謂呼意而名也我為于偽切𩐎子兮切碎也長於丁丈切坐忘復扶父切見賢遍切下同蹴然子六切變色貌墮許規切壞也離形力智切去超吕切無好呼報切推極委命淋雨音霖左傳云雨三日以往為霖殆病殆危殆也食音嗣不任音壬而趨七住切崔云不任其聲憊也趨舉其詩無音曲也內篇應帝王七不言之教齧缺五結切下丘悅切王倪五兮切二人已出齊物篇四問而四不知謂再四之問或齊物篇中四問子知物之所同是乎一問也子知子之所不知邪二問也然則物無知邪三問也子不知利害則至人固不知利害乎四問也蒲衣子尸子云蒲衣八歲舜與天下即被衣王倪之師也泰氏司馬云上古帝王也又無名之君也藏仁才剛切崔云懷仁心以結人也簡文本作臧善也以要一遙切泰氏之世見劉得一本舊闕徐徐司馬云安隱貌于于司馬云無所知也簡文云徐徐于于寤寐之狀無為之治日人實切中如字又音仲始李云賢人也肩吾之師崔本無曰字以語魚據切庶民見張君房本舊作式義度人欺德欺妄也涉海鑿在洛切下同河溟海浩渺波涌難涉穿鑿為河必無成理確乎苦學切堅貌矰則能切罔也弋逸織切以繩繫箭而射之鼷鼠音兮小鼠也神丘社壇也熏香云切自然之化天根喻無氣也無名人喻道也皆寓言殷陽文云山名在衛州山南曰陽又云地名蓼水音了水名不豫間豫也莽莫蕩切眇妙小切六極之外陰陽之表也壙苦廣切垠力黨切帠帠音藝法也於淡徒暫切於漠音莫聖人無名陽子居居名也子男子通稱也嚮許亮許兩二翻疾強梁不容惡也物徹疏明用聰明也不倦其眷切勞也胥相也易音亦技其綺切藝也係如字怵心勑律切來田田獵也虎豹以皮有文章見獵也猿音袁狙七餘切之便毗肩切斄來狸二音來藉慈夜切踐也與躤通用蹴然子六切改容貌功蓋侔也化貸吐代切有莫舉名莫無也舉顯也推功於物不顯其名聖人無常心神巫曰季咸季咸姓名也巫覡男女之通稱也心醉迷惑其道壺子名林鄭人列子師無其文向秀本作無江南古藏或作玩又作既玩既並非是得道與音餘世亢苦浪切必信夫句絶相汝息亮切下同嘻音熙嗟也嚮吾許亮切地文地以不動為文不震不正一本作不不止動靜不發也社德機藴道息念也有瘳丑留切天壤天以發生為壤名實不入毁譽不入靈府機發於踵生氣一動上下融和不齊側皆切下同鯢五兮切桓鯢鯨魚也桓盤桓也之審如字簡文云處也司馬云審當為蟠蟠聚也崔作潘云回流所鍾之域也鍾亦聚也淵有九名鯢止流濫沃氿雍汧肥是為九淵鴻烈解有九琁之淵至深也自失如字徐音逸已滅不見也委於危切蛇以支切至順之貌弟如字舊音頽靡順貌一云頽靡不窮貌一云遜伏也波流波流至順莫測貌為其于偽切妻爨七判切食豕音嗣下同雕琢竹角切塊然苦對切紛然而芳云切亂也然見張君房本舊闕封哉不散也崔本作戎云封戎散亂也寄託無朕直忍切兆也開兊倏音叔李云喻有象也忽李云喻無形也渾胡本切沌徒本切寶玄真經曰三氣未分謂之混五行未彰謂之沌簡文云倏忽取神速為名渾沌以合和為兒神速譬有為合和譬無為七竅苦叫切孔也渾沌死崔云不順自然強開耳目也南華真經章句音義卷之四
