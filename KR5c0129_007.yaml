front:
  text: 南華真經章句音義卷之七習七
  hash: sha256:be77ea3dbe88d02c06430130101144981cdca1dc54ac7a34477cc4cfa6cf8d30
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5c0129_HFL_007-001a, image: hfl/0495/0495-158.png}
body:
  text: 碧虛子造雜篇盜跖十六率性孔子與柳下季為友柳下惠姓展名獲字季禽一云字子禽居柳下而施德惠一云惠諡也一云柳下邑名按左傳云展禽是魯僖公時人至孔子生八十餘年若至子路之死百五六十歲不得為友是寓言也盜跖之石切李奇注漢書云跖秦之大盜也黃法師云季弟名雍為大盜秦人謂盜為跖故時呼曰盜跖從才用切卒尊忽切下同穴室摳户苦溝切司馬本作樞尺朱切云破人户樞而取物也入堡一本作保鄭注禮記云小城曰保能詔詔告也或云訓也竊為于僞切下請為為我竊為使為以為皆同說之始鋭切飄風婢遙切易辱以豉切休卒徒於太山之陽於見江南古藏本舊闕膾古外切說文細切肉也餔蒲故切食也屈原曰餔其糟冠古亂切枝木之冠冠多華飾如木之枝繁帶死牛之脅許劫切司馬云取牛皮為大草帶僥幸古堯切僥幸冀望也願望履幕下司馬云幕作綦云言視不敢望跖面望履蹟而還也綦履蹟也反走小却行也瞋目赤真亦夷二切廣雅云張也如乳儒遇切育也凡天下人有三德人見張君房本舊闕少長詩召切下丁丈切勇悍户旦切激丹古歷切明也齊貝珠也一作含貝音中丁仲切南使所吏切下三字同共祭音恭之行下孟切下同恆民一作順民後亦爾好面呼報切下同背音佩下同橡音象煬羊亮切炙燥也居居于于成云居居安靜之容于于自得之貌蚩尤黃帝之時蚩尤為暴戰於涿鹿之野逐擒蚩尤身體殺異處故别葬之涿鹿音卓司馬云地名故城今在上谷郡西南八十里武王弒音試下同縫衣扶恭切成云縫掖之衣也淺帶成云淺狹帶也矯言紀表切去其起吕切危冠李云危高也史記云仲由字子路下人也性鄙好勇力志伉直冠雄雞冠佩猳豚陵暴孔子孔子設禮稍誘子路後儒服委質請為弟子子路為衛大夫聞孔悝之邑宰蕢聵乃與孔悝作亂謀入立是為莊公子路在外聞之馳往入造蕢聵蕢聵與孔悝登臺子路欲蟠臺蕢聵懼乃下石乞壺黶攻子路擊斷子路之纓子路曰君子死而冠不免遂結纓而死一云身遭菹醢其卒子恤切身菹莊居切菹醢也再逐於魯削跡於衛並解禪王篇窮於齊史記云孔子適齊為高昭子家臣欲以通乎景公與齊太師語樂聞韶音學之三月不知肉味齊人稱之復景公恭見孔子待以季孟之間魯有三卿季氏為正卿最貴孟氏為下卿不用事言待之以二者之間也齊大夫欲害孔子孔子聞之景公曰吾老矣弗能用也孔子遂行此謂窮於齊也圍於陳蔡已解禪王篇堯不慈不授丹朱天下舜不孝或謂避逃瞽叟或謂不告而娶禹偏枯治水而得疾湯放其主放桀於鳴條武王伐紂誅紂於牧野文王拘羑里史記云紂醢九侯西伯昌聞之竊嘆崇侯虎知之以告紂紂之二十年囚西伯於羑里羑里獄名在河內湯陰而彊其丈切鮑焦韓嬰云鮑焦周時隱士也衣弊膚見挈畚採蔬遇子貢於道子貢曰吾子何以至此也鮑焦曰天下之遺德教者衆矣吾何以不至於此也吾聞之世不已知而行之不已者是爽行也上不已知而千之不止者是毁廉也行爽廉毁然且不舍惑於利也子貢曰吾聞之非其世者不生其利汙其君者不履其土今吾子污其君而履其土非其世而採其蔬此誰之有哉鮑焦曰於戲吾聞賢人重進而輕退廉士易醜而輕死乃棄其蔬而立槁死於洛水之上君子聞之曰廉夫剛哉夫山鋭則不高水狹則不深行特者其德不厚志與天地疑者其為人不祥鮑子可謂不祥矣其節度淺深適至是而已矣或云抱木而立枯焉申徒狄韓嬰云申徒狄商時人非其世將自投於河崔嘉聞而止之曰吾聞聖人仁士之於天地之間民之父母也今為濡足之故不救溺人可乎申徒狄曰不然昔者桀殺關龍逄紂殺王子比干而亡天下吳殺子胥陳殺泄治而滅其國故亡國殘家非無聖智也不用故也遂負石沈於河君子聞之曰廉乎如仁與智吾未見也介子推史記云介子推晋人也文公反國以賞從士未至隱者介子推推亦不言祿祿亦不及推推曰獻公子九人唯君在耳惠懷無親外內棄之天未絶晋必將有主主晋祀者非君而誰天寶開之二三子以為己力不亦誣乎竊人之財猶曰是盜況貪天之功以為己力乎下冒其罪上賞其姦上下相蒙難與處矣其母曰盍亦求之以死誰懟推曰尤而效之罪有甚焉且出怨言不食其祿母曰亦使知之若伺對曰言身之文也身欲隱安用文之文之是求顯也其母曰能如此乎與汝偕隱至死不復見介子推從者憐之乃懸書宫門曰龍欲上天五蛇為輔龍已升云四蛇各入其宇一蛇獨怨終不見處所文公出見書曰此介子推也吾方憂王室未圖其功使人召之則亡遂求所在聞其入綿上山中於是文公環綿上山中而封之以為介推田號曰介山以記吾過且旌善人一云文公待之不肯出求之不能得以為焚其山宜出及焚其山遂不出而燔死以食音嗣燔死音煩燒也尾生魯人也或作微生磔大竹客切張其尸曰磔史記封禪書云秦德公初作伏祠社磔狗邑四門以禦蟲菑流豕屠者烹豕曰流操七曹切瓢婢遙切而乞者言上六人不得其死猶猪狗乞兒流轉溝中者也乞或作走利名見張君房本舊作離子胥沈江吳越春秋云子胥諫吳王不聽據地垂涕曰於乎哀哉遭此默默忠臣掩口譖夫在側政教道壞諂諛無極邪說僞辭以曲為直舍譖攻忠將滅吳國宗廟既夷社稷不食城郭丘墟殿生荆棘吳王大怒賜屬鏤之劍令自裁子胥遂伏劍而死吳王乃取子胥尸盛以鴟夷之器投之於江中比干剖心史記云紂溼亂不止微子數諫不聽乃與太師少師謀遂去比干曰為人臣者不得不以死爭則百姓何辜乃直言諫紂紂怒曰吾聞聖人之心有七竅信有諸乎乃遂殺王子比干刳視其心不過古卧切超也病瘦色又切騏驥音其冀過隙去逆切亟紀力切忽也或作極無復扶又切狂狂不定貌汲汲音急不足貌芒然莫剛切據軾音式車前橫木憑而坐者得微微無也自灸久又切走料音聊觸也頭編音鞭幾不音祈近也行義子張史記云姓顓孫名師字子張孔子弟子行義篤信滿苟得寓言也喻苟且所得以致滿盈之人盍胡臘切何不也為行下孟切下同勸何不為德行多信伸信同音說文屈伸也經典信通作伸下同以義求之臧聚司馬云謂臧獲盜濫竊聚之人則怍色見張君房本舊作則有怍色宰相息亮切下相而同入嫂先早切成云桓公名小白殺兄子糾納嫂為家管仲賢人而臣輔之為臣或作相弒君申志切成云初孔子聞田成子弒簡公沐浴而朝告於哀公曰陳怛弒其君請討之此賤而下之也後受田成子聘兼納其幣此言行之相違也論則力頓切悖戰布內切亦拂扶弗切違也長幼丁丈切下長子同五紀司馬云歲日月星辰歷數文云天為地紀日為星紀君為臣紀父為子紀夫為妻紀成云金木水火士又仁義禮智信又祖父己身子孫六位君臣父子夫婦文云易之六位也為别彼列切下同堯殺長子崔云堯殺長子考監明成云不與丹朱位言義殺也吕覽曰堯有十子舜有九子舜流母弟流放也孟子云舜封象於有庳身為天子而弟為匹夫可謂親愛之乎王季為適周公殺兄史記云古公有長子太伯次曰虞仲太姜生少子季歷季歷娶太任皆賢婦人生昌有聖瑞古公曰我世當有興者其在昌乎長子太伯虞仲知古公欲立季歷以傳昌乃二人亡如荆蠻古公卒季歷立是為公季此乃王季為適也武王伐紂封弟周公旦於曲阜曰魯弟叔鮮於管弟叔度於蔡武王崩太子誦代立是為成王成王少周公乃攝行政當國管叔蔡叔疑周公作亂周公奉成王命誎管叔放蔡叔此乃周公殺兄也儒者僞辭史記云孔子去陳過蒲會公叔氏以蒲畔蒲人止孔子弟子有公良孺者以私車五乘從孔子其為人長賢有勇力謂曰吾昔從夫子遇難於匡今又遇難於此命也已吾與夫子再罹難寧鬥而死甚疾蒲人懼謂孔子曰苟母適衛吾出子與之盟出孔子東門孔子遂適衛子貢曰盟可負邪孔子曰要盟也神不聽且子正為名假設之辭也為于僞切下為利同不監本作鑑吾昔見張君房本舊作日人實切訟於無約如字徐於妙切訟論說也子胥抉眼史記云子胥諫吳王不聽賜子胥屬鏤之劍以死將死曰抉吾眼置之吳東門以觀越之滅吳也直躬論語曰直躬者其父攘羊而子證之尾生鮑子已解在前申子不自理史記云晋獻公太子申生為驪姬陰令人譖惡置毒藥於胙中泣曰太子何忍也其父而欲弒代之况他人乎且君老矣旦暮之人曾不能待而欲弒之太子聞之奔新城獻公怒乃誅其傅杜原疑或謂太子曰為此藥者乃驪姬也太子何不自辭明之太子曰吾君老矣非驪姬寢不安食不甘即辭之君且怒之不可或謂太子曰可奔他國太子曰被此惡名以出人誰內我我自殺耳申生自殺於新城孔子不見母匡子不見父文云仲尼歷聘不見母亡匡章齊人諫其父為父所逐終身不見父所傳文專切安處無足一本作無知樂意音洛下同故推正而不忘也忘或作妄言君臣但推尋正道不忘故不用富貴邪為智力不足故不用邪絶俗過世之士焉言人心易動但人與賢人俱生便自謂過於世人況親自為富貴者乎慘七感切怛丹曷切之恐丘勇切窮美窮猶盡也究勢究竟也俠人音協欲惡烏路切爭四處黃疏云湯武也按商書云葛伯不祀湯始伐之其後東征西夷怨南征北狄怨皆曰徯我后后來其蘇此豈非爭四處邪要名一遙切亦猶見江南古藏本舊闕長厄音厄管籥音藥一本管籥作塤箎口嗛苦簟切醪醴力刀切賅音礙飲食至咽為賅於馮氣音憤滿也下同言憤畜不通之氣也上坂見張君房本舊闕取慰亦作畏張君房本辱不舍音捨下同戚醮在遙切李云憔悴也疑劫許業切內周棲疏李云重棲內匝踠軒外通設備守具也財單音丹或作蘄繚音了纏繞貌南華真經章句音義卷之七
