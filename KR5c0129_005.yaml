front:
  text: 南華真經章句音義卷之五習五
  hash: sha256:887d128dfb238330763cd7fce5d6837fbfcb6c17b9d67b349801b124e2286bed
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5c0129_HFL_005-001a, image: hfl/0495/0495-106.png}
body:
  text: 碧虛子造外篇駢拇八養正性命駢步田切並也併也拇音母謂足拇指連第二指也枝指如字崔音歧謂指有歧也而侈昌是切多貌於德德者容德也盜跖謂容美為父母之遺德也附贅章鋭切廣雅云疣也釋名云橫生一肉屬著體也又瘤結也縣疣音尤說文云贅也列於五藏才浪切下同文云肝木仁也肺金義也心火禮也腎水智也脾土信也夫含識之徒禀生之類仁義之性物皆有之少之與多自然已定雖顔孔相去一分終莫之及况異於斯者乎今性多仁義者必相矜而失性性少仁義者又相企而喪真奔馳於矜企之塗流蕩於是非之境上下夸企豈是道德之正邪若乃人安其性多少之情為一物守其分仁義之理自齊任官各當其材天下無不理矣淫僻匹亦切下同於仁義之行下孟切崔云駢枝贅疣雖非性之正亦出於形不可去也五藏之情雖非道德之正亦列於性不可治也今設仁義之教以治五藏之情猶削駢枝贅疣也既傷自然之理更益其疾矣而多方於聰明之用也舊本云而多方於聰明之用也張君房削去方字與下文多於聰者相類駢於明駢拇為不足者比五指之數則謂之虧矣駢明為多者以兼倍他性則謂之有餘矣文章青與赤為文赤與白為章黼黻音甫弗解在大宗師篇煌煌音皇光也又目炫貌非乎言是也離朱即離婁也司馬云黃帝時人百步見秋毫之末又千里見針鋒是已猶是也五聲一本作音宫商角徵羽六律黃鍾大簇姑洗蕤賔夷則無射金金鍾石磬絲竹琴瑟簫管黃鍾君之音也大吕六吕師曠解在齊物篇擢德音濯拔也簧鼓音黃謂笙簧也鼓動也曾史史記云曾參字子輿行仁史鰌字子魚行義纍劣彼切瓦如字結繩聚無用之語如瓦之纍繩之結也竄七亂切微也藏也句紀具切司馬云竄句謂邪說微隱穿鑿文句也敝本亦作蹩音婢跬犬蘂切敝跬分外用力不前貌楊墨楊朱秦人墨翟宋大夫鳧音符脛形定切鶴户各切齕恨沒切齧也啼音提蒿目好羔切蒿目喻昏亂以其多憂致目昏蒿蒿然叨吐刀切貪也囂囂許嬌切歡聒企慕貌屈折之熱切謂屈折支體為禮樂也俞臾喻二音謂噓俞顔色為仁義之貌纆音墨索也索悉各切誘然皆生謂相誘呼聚以樂其生也訹息有切連連司馬云謂連續仁義遊道德之閒以撓而小切亂也性與音餘此下可以意求後皆倣此三代夏商周殉辭俊切營也又云殺身從人曰殉藏作郎切崔云好書曰藏又善也方言云齊之北鄙燕之北郊凡民男而壻婢謂之藏女而婦奴謂之獲張揖云壻婢之子謂之藏婦奴之子謂之獲穀孺子曰穀又善也牧羊牧養之牧挾音協策初革切李云竹簡也古以寫書長二尺四寸博塞悉代切博奕之類也漢書云吾丘壽王以善格五待韶謂之博塞也成云行五道而投瓊曰博不投瓊曰塞伯夷死名於首陽伯夷已解大宗師篇首陽山名在河東蒲坂縣盜跖死利於東陵漢書云盜跖秦之大盜也東陵泰山也又陵名今東平陵屬濟南郡又惡音烏屬其時欲切係屬也徐音燭謂屬著也下同俞兒音榆黃帝時善識味人也崔云尸子曰膳俞兒和之以簧桂為人主上食之行下孟切外篇馬蹄九智慧生僞馬釋名云武也在下而行者也蹄音提馬足甲也禦魚吕切敵也齕恨沒切齧也翹祁饒切舉也足崔本作尾而𩣱音陸跳也張君房本作𩣱馬健也義許宜切飬也臺羲臺猶高臺也路寢大室也伯樂音洛伯樂姓孫名陽善馭馬石氏星經云伯樂星名主典天馬孫陽善馭故以為名燒之燒鐵以爍之剔之刺歷切剪毛也刻之削甲也雒之羈雒其頭江南古藏本作絡羈古宜切勒也馽丁邑切絆前兩足也編之必然切皂才老切櫪也槽也崔云間闌養馬之所也棧士板切編本作檀似牀曰棧以禦濕也又木棚也驟之士救切整之整之以衡枙齊之齊之以鑣轡橛其月切銜也鏣也飾音式排銜也謂加飾於馬騼也鞭必然切策初革切馬檛也帶皮曰鞭無皮曰策檛竹瓜切陶道刀切窯也埴時刀切土也埴土可以為陶器又土黏曰埴中規丁仲切下同天放崔本作牧云養也填填音田質重貌顛顛丁田切專一貌蹊音兮徑也隧音遂道也舟梁舟船橋梁連屬其鄉王云既無國異家殊故其鄉連屬遂長丁丈切攀普班切援音袁牽也引也窺去規切惡乎音烏不離力智切素朴普剝切蹩步結切躠悉結切成云用力貌踶直氏切跂丘氏切成云矜恃貌澶徒旦切漫武半切成云縱逸貌摘敕歷切辟匹壁切成云折節貌純朴不殘成云木金曰純朴未雕曰不殘犧樽音羲尊司馬云畫犧牛象以飾樽也王肅云刻為牛頭又音先河切畫鳳凰羽以飾樽婆娑然也圭璋音圭璋鋭上方下曰圭半圭曰璋不離别離之離交頸頸領也相靡靡也相踶大計徒兮二切踏也小踏謂之踶衡扼於革切衡轅前橫木縛軛又馬頸者也月題徒兮切崔云馬額上當顱如月形者也又謂縣在額上制如月形介古太切倪五圭五第二切李云介倪猶睥睨也闉扼音因曲也鷙敕二切曼武半切鷙抵也曼突也闉扼鷙曼距扼遲頓也司馬云曲頸於扼以抵突也一云鷙曼旁出也詭九彼切銜口中勒也詭銜吐出銜也竊轡齧轡也崔云詭銜竊轡戾銜橛盜艱轡也赫呼白切胥氏司馬云上古帝王也有赫然之德使民胥附故曰赫胥蓋炎帝也含喃音步縣跂音企踶直氏切跂丘氏切好呼報切外篇胠篋十絶聖棄智胠超居切司馬云從旁開為胠一云發也篋苦愶切探吐南切囊乃剛切匱其位切檻也必攝結也收也緘古咸切縢崔本作同徒登切約也緘縢皆繩也扃古熒切關也鐍古穴切紐也崔云環舌也揭其謁切又音桀舉也擔也負也擔丁甘切而趨七須切走也唯恐丘用切向之亦作嚮許亮切為大盜于僞切下同罔罟音古同之通名耒力對切犁也一云耜柄也耨乃豆切鉏也或云以木為鉏柄所刺七智切闔户臘切社稷封士曰社封穀曰稷邑屋州閭鄉曲者三百畝為屋三千六百畝為邑二十五家為閭二千五百家為鄉萬二千五百家為州田成子史記云齊大夫田常也魯哀公十四年田常弒君簡公割安平以東至琅邪自為封邑自敬仲食采于齊至威王為齊侯故十二世也曷嘗不法聖智哉舊作曷嘗不法聖人哉善人不得聖人之道不立跖不得聖人之道不行則聖人之利天下也少聖人生而大盜超掊擊聖人聖人已死聖人不死雖重聖人是乃聖人之過也彼聖人者天下之利器也自此已上十一聖人張君房本並作聖智令從張本龍逄斬被桀斬首比干剖普口切比干曰為人臣者不得不以死爭乃彊諫紂紂怒曰吾聞聖人心有七竅剖比干觀其心萇直良切弘肔敕紙切肔裂也萇洪周靈王賢臣也景王之大夫魯哀公三年六月周人殺萇洪又云劉康讒之於王曰萇洪遺叔向書曰子起晋兵以攻周晋殺劉氏靈王乃剔萇洪而殺之于蜀矣又云鈹裂而死又刳腸曰肔子胥靡容池切靡爛于江解在大宗師篇故跖之石切之藏才浪切魯酒薄而邯鄲音寒丹趙國都也圖楚宣王朝諸侯魯恭公後至而酒薄宣王怒欲辱之恭公不受命乃曰我周公之後長於諸侯行天子禮樂勳在周室我送酒已失禮方責其薄無乃太甚遂不辭而還宣王怒乃發兵與齊攻魯梁惠王常欲擊趙而畏楚救楚以魯為事故梁得圍邯鄲言事相由也亦是感應宣王名熊良夫悼王之子恭公名奮穆王之子又云楚會諸侯魯趙俱獻酒於楚王魯酒薄而趙酒厚楚之主酒吏求酒於趙趙不與吏怒乃以趙厚酒易魯薄酒奏之楚王以趙酒薄故圍邯鄲也掊普口切擊古歷切聖智謂破碎聖智故曰絶聖棄智也縱舍音捨盜賊盜賊所利謂金寶故曰不貴難得之貨聖智已死大盜不起白云事業日新新者為生故者為死故曰聖人已死也乘天地之正御日新之變得實而損其名歸真而忘其盜則大盜息矣聖智不死大盜不止向云聖人不死言守故而不日新牽名而不造實也大盜不止不亦宜乎為之斗斛以量之向云自此以下皆所以明苟非其人雖法無益權衡李云權稱錘也衡稱衡也錘直僞切符璽音徒符分為兩片合而為一今銅魚木契也璽玉印也矯之居表切竊鉤鈎帶也揭其謁其列二切斧鉞音越能禁居鴂切下不可禁同擲玉持赤切崔云猶投棄也殫音丹盡也鑠絶詩灼切李云燒斷也崔云消壞也下不鑠同竽音于成云竽形似笙並布管鈲內三十六簧為竽十九簧為笙瑟本亦作笙成云瑟長八尺一寸廣一尺八寸二十七弦伏羲造膠音交攦吕係切李云折也崔云撕也工倕音垂堯時巧人也之行下孟切鉗巨炎切閉也攘如羊切却也不僻四亦切爚音藥云火光銷也又散也容成氏至神農氏此十二氏皆古帝王驪力池切畜氏江南古藏本作驪連氏伏羲音希樂其音洛贏音盈裹也負也糧音良而趨七于切上好呼報切下同弩暖五切畢弋機兔網曰畢綱有柄形似畢星繳射曰戈弩牙曰機鉤餌如志切罔罟罾音曾笱音苟取魚竹器也成云曲梁也亦筌也鉤釣也餌魚餌也罟謂之罔罾魚網也削格上息約切下古百切削格所以施羅網也成云以竹木為之今鹿角槍也羅落罝子斜切罘音孚成云鳥罟謂之羅兔罟謂之罾罬謂之罦罦覆車也今切車也漸毒將庶切漸漬之毒不覺深也又漸毒猶深害也頡户結切滑乎八切謂難料理也又不正之語也亦姦黠也解苦懈切垢苦豆切詭曲之辭又並如字謂辨能解釋垢穢猶解嘲也每每母罪切說文草盛上出也今言每每大亂謂其亂如草之盛也上悖必內切薄食也下爍失約切銷也中墮許規切壞也毁也之施始豉切喘本作𧍒川兖切耎耳轉切動蟲也又無足蟲也又地行之蟲曰喘耎肖音消翹祁饒切飛空之蟲曰肖翹李云翾飛之屬也舍夫音捨符種種章勇切種種謂守種類不相侵奪謂淳厚也役役之佞役役猶伋伋謂姦黠也恬徒謙切惔徒暫切啍啍之純之閏一切郭云以己誨人貌南華真經章句音義卷之五
