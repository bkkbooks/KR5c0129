front:
  text: 南華眞經章句音義卷之十四習十四
  hash: sha256:59d047e8ccb89f00caa06289c55b0e02f6faf64ac72b69a2bd7d7f388349e0ab
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5c0129_HFL_014-001a, image: hfl/0496/0496-148.png}
body:
  text: 碧虚子造雜篇寓言三十一中道寓言十九寓寄也以人不信已故託之他人十言而九見信也重言謂德重之人所言也巵言日出音支李起宜切夫巵器滿則傾空則仰中則正以喻中正之言也夫日出未中則斜過中則昃及中則明故巵言日出者義取其中正而明也天倪音崖成云自然之分也藉郭云借也李云因也子媒成云合也耆艾五蓋切經緯文云六經六緯也成云上下曰經傍通曰緯本末文云本道德末仁義以期成云待也陳人成云陳乆之人曼衍以戰切不斷也文云不留滯也惡乎音烏下同皆種章勇切相禪音擅成云代也時化好呼報切惡烏路切蘁音悟又五各切逆也係禄三釜小爾雅云六斗四升曰釜心樂音洛下同三千鍾成云六斛四斗曰鍾不洎其器切及也若參所金切无所縣其罪乎縣係也心再化於禄所存者親也雖係禄而无係於罪也如觀鳥雀古亂切鳥見張君房本舊闇蚊蝱孟庚切鳥雀蚊蝱相過忽然不覺王云鳥雀蚊蝱取大小相縣以喻三釜三千鍾之多少叙學子綦音其勸公以其私死也私見張君房本舊闕歷數在天成象有曆數可以推人據在地成形有人據可以知惡乎音烏下同獨化括撮古活切撮見君房本舊闕被髮皮寄切叟叟本又作搜搜同素口切又音蕭向云動貌稍山巧所教二切有漸也蜩甲音條司馬云蟬蜕皮也蛇蜕音悦又吐卧始鋭二切吾屯徒門切聚也而况乎以无有待者乎无見張君房本舊闕去驕陽子居姓陽名戎字子居之沛音貝成云彭城也今徐州邀古堯切要也遇也玉篇云求也抄也遮也於梁成云宋地也今汴州至舍逆旅之舍也盥音管澡手也灑也漱所救切盪口也巾櫛莊乙切梳之總名也屨俱遇切履也睢睢許圭切仰曰也盱盱香于切張目也蹴子六切成云慚悚驚懼也家公李云主人公也煬羊尚切向云炊也雜篇列御寇三十二岀異伯昬瞀人音茂又音務楚之賢士隱者也列子亦師事之又作无人奚方李云方道也吾驚焉李云見人感已即違道故驚也惡乎音烏十漿子祥切謂十家並賣漿也亦作𩞟五漿先饋饋遺也謂十家中五家先見造王云皆先饋進於己不解音蟹形諜徒協切郭云便辟也說文間也成光司馬云形諜於衷成光華也貴老謂重列子過於老人而𩐎子兮切亂也爲食音嗣无多餘之贏音盈无見江南李氏張君房本舊闕萬乗繩證切而效如字或作校古孝切處己音紀成云汝安處己身不能忘我獨顯形儀爲物所歸保汝司馬云保附也无幾居豈切敦杖音頓蹙之子六切賔者本作儐必刃切謂通客之人也跣而先典切暨其器切至也發藥如字司馬本作廢藥廢置也而焉於虔切摇而本性一本性作才又无謂也動摇本才以致求者又非道德之謂也小言言不入道故曰小言人毒以其多患故曰人毒莫覺莫悟何相孰也彼不敢告汝汝又不自覺何期相孰哉王云小言爲毒曾无告語也謂誰相親愛者既无告語此不相親愛之至也汎若芳劍切自伐緩也緩名也鄭國之儒者名緩是時儒墨二學方盛緩欲使弟翟學墨更受爲墨之利呻吟音申謂吟詠學問之聲也又云呻吟讀誦也裘氏之地地名崔云裘儒服也因而名地祇三年而緩變爲儒翹移切說文地祇提出萬物者也謂學出千日而儒業成河潤九里文云河從乾位來乾陽數九也使其弟墨謂使緩弟翟成墨也闔闔何不也嘗視其良良者良人斥緩也言何不試視緩墓上已化爲揪栢之實良或作垠音浪冢也闔嘗視其良見江南古藏本舊本作闔胡嘗視其良相捽才骨切言穿井之人爲己有造泉之功而捽飮者不知泉之天然也喻緩不知翟天然之墨而忿怨之内照莊子曰知道易以豉切古之至人見張君房本舊闕无益朱泙音平漫未旦切司馬云朱泙漫支離益皆人姓名屠音徒單音丹盡也千金之家如字本作賈亦作價一本作産技成其綺切乖理順於兵順或作慎敝淺小夫成云凡夫也不離力智切苞苴子餘切司馬云有苞裹也竿音干牘音獨司馬云竹簡爲書以相問遺修意氣也成云苞苴香草也夫搴芳草以相贈折簡牘以相問非大丈夫之所爲也敝精神婢世必世二切蹇淺徒小貌甘瞑音眠發泄息列切濫進曹商宋之小人爲于僞切宋王司馬云偃王也使秦所吏切乗繩證切下同阨巷於懈切困窘其隕切急也槁苦老切項李云羸瘦貌黄馘古獲切司馬云謂面黄熟也從車才用切隨行也秦王司馬云惠王也痤祖禾切癤也舐食紙切痔治紀切觀迹有瘳敕由切圾乎魚及切危也從事華辭以支爲㫖雕琢華藻支蔓㫖要汝與予頤與汝與頤與並音黨與之與也予音椎與之與也離實力智切施於始豉切商賈音古宵人王云非明正之徒謂之宵夜之人也訊之音信問也察行貌愿音願廣雅云謹慤也有長丁丈切若不肖外如長者内不似也有順或本作㥧古順字殊閏切理也王本並江南古藏本並作慎一本作循懁音環三蒼云急腹也王云研辯也外慎研辯常務質訥縵或半切李云内實堅外如縵也釬胡旦切又音干急也一云情貌相反卒然寸忽切其則法則也或作側不正也一云謂醉者喜傾側冠也九徵索也索其人情眞德正考父宋湣公之遠孫弗父何之曾孫成云則孔子十八代祖宋大夫也而傴紆矩切而僂力矩切三命士一命大夫再命郷三命也而夫郭云凡夫也吕鉅矯蹇貌孰協唐許協同也唐堯許由皆崇謙者也言考父與而夫誰同於唐許也自好呼報切而吡匹爾切郭云訾也必達窮有八極極至也達有三必必者分之極也刑有六府府聚也美髯人鹽切縁循文云不能行也偃佒於丈切文云胸出也困畏不若人文云怯懦也三者俱通達文云三者無用於人不見任役俱能達盡其生理者也六者所以相刑也見劉得一本舊闕傀郭呼乖切大恬貌者肖如字似也竊禄人有見宋王成云宋襄王時有庸瑣之人游宋佞說宋王錫車十乗也十乗繩證切下同驕稺直吏切李云自驕而釋莊子也成云釋後也排莊子於己後自矜先物也緯蕭緯織也蕭荻蒿也織蕭以爲畚而賣之也本或作葦音同鍜之丁亂切謂槌破也九重直龍切驪龍力馳切黑龍也文云毒龍也頷下户感切𩐎子兮切粉夫音符樂生其使所吏切衣以於既切或聘君以書幣詔之曰聘食以音嗣芻菽初俱切芻草也菽大豆也規葬珠璣析機二音或云王者諸侯之棺以沙畫棺四時之色左蒼龍右白虎上著金銀日月玉衣珠璧以飾棺也沙謂朱砂塗之也黄疏云圓者爲珠不圓爲璣連璧桓譚新論曰通也爲服服用也相息亮切里勤司馬云墨師也姓相里名勤苦獲己齒李云二人姓字而倍音佩譎音决相訾音紫以觭紀宜切成云獨唱曰觭註文牛角一俯一仰曰觭不仵之辭如此也不仵誤五二音巨子向云墨家號其道理成者爲鉅子若儒家之碩儒也之好呼報切枯槁苦老切不舍音捨下章同明治不忮之豉切逆也崔云害也字書云狠也白心崔云明白其心也或作任心宋鈃音形宋人也著書十八篇師黄老尹文崔云齊宣王時人著書二篇成云宋鈃尹文並齊宣王時人同游稷下華山之冠華山上下均平作冠象之表已心均平也以别彼列切宥爲始始首也崔云以别善惡宥不及者爲之首也一曰别有區域也始本也置立名教應接人間而區别萬有用斯爲本以聏音而王云和也一云調也聏和萬物合則歡矣合驩以道者物和而調之合意則歡矣上說音悦下教上謂國主也悦上之教下也一云說猶教也上教教下也彊其丈切聒古活切謂彊聒其耳而語之也見厭於豔切爲人于僞切下自爲同圖傲乎五報切圖傲乎者謂不圖傲也苛察音河一本作荀其行下孟切又如字論法不黨或作當崔本作黨云至公無黨也易而以豉切彭蒙齊人田駢薄田切齊人著書十五篇有辭辯慎子云名廣慎到趙人著書四十二篇三人並遊稷下不徧音遍泠音零汰音泰泠汰簡練也謑户禮切說文恥也一曰謑詬小人怒也髀户瓦切郭云謑髁訛倪不正貌王云謂謹刻也无任无所施任也王云雖謹刻於法而猶能不自任以事事不與衆共之則无爲尚賢所以笑也縱脱成云縱恣脱略不爲仁義之德行也无行下孟切下人之行同椎直追切拍普百切成云笞撻也輐五管切斷丁管切成云行刑也王云推拍輐斷皆刑戮者所用宛轉成云變化也舍是音捨巍然魚威切成云不動貌若飄婢遥切爾雅云回風也之還旋環二音若磨末佐切石之隧音退回也全而无非磨石所剴麤細全在人其德全无見非責時言其无心也无逮已之患江南本作逮舊作遠不離力智切夫塊苦對切窢況逼火麥二切向云逆風聲也然惡音烏於魭五管切斷丁管切與上義輐斷同謂行刑也成云雖復立法施化而未能太齊萬物故不免於魭斷也之韙于鬼切是也槩乎古愛切成云梗槩也文云節槩也贊老澹然徒暫切關尹關令尹喜字公度著書九篇周平王時爲函谷關令老聃他甘切即老君也以濡如兖切若響許丈切芴乎音忽谿苦兮切之垢音苟巋然去軌切成云獨立之謂不費芳味切損也雖未至極舊作可謂至極江南古藏本作雖未至極者謂言教也言教乃老君關令應物化人之粗語耳未是極致之妙極致之妙豈可言哉叙莊死與音餘下同芒乎莫剛切下同謬悠謂若忘於情實者也一曰虚關也荒唐謂廣大无域畔者也一曰孟浪也不儻丁蕩切謂倜儻之儻不儻者謂守法度也以觭音羈不偶也莊語莊莊子也以巵音支曼衍以戰切已解寓言篇敖五報切倪音詣成云敖倪驕矜貌不譴遣戰切壞古回切瑋于鬼切奇特也連犿音藩謂與物相從不違故无傷也參初林切差初宜切文云不常貌諔尺叔切詭九委切文云異俗貌而闢婢亦切深閎音宏不蜕音悦又始鋭切一本作脱評惠惠施多方舊說不録其新儀備載章句之下此不復疏五車尺蛇切又音居舛川兖切駁邦角切不中丁仲切歷或作厤方睨音詣汜芳劍切大觀古亂切曉辯字林云辯慧也樂之音洛不蹍女辰切鑿曹報切枘如鋭切鏃子木切矢鏑也驪力知切捶章藥切桓團除丸切之囿音又其柢典禮切說文木根也又丁計切倚人如字本或作畸音紀宜切李云異也黄繚音了李云賢人也不墜直類切霆音廷徧爲于僞切隩烏報切李云深也蚊音文蝱孟庚切駘音殆蕩舊云駘者放也放蕩不得也悲夫舊音義云郭象之注論其大體眞可謂得莊生之㫖矣郭生前歎膏粱之塗說余亦晩睹貴遊之妄談斯所謂異代同風何可復言也或曰莊惠操濠梁之契發郢匠之模而云其書五車其言不中何也豈契若郢匠襄同寢斤而相非之言如此之甚者也答曰夫欲拯有教之肆神明其言者豈得不善其辭而盡其喻乎莊生振徽音於七篇列斯文於萬世重言書涉玄之路從事展有辭之叙雖談元貴辯而教无虚唱然其文易覽其趣難窺造懷而未達者有過理之嫌祛斯之弊故大舉惠子之云辯也南華眞經章句音義卷之十四
