front:
  text: 南華真經章句音義叙習一
  hash: sha256:26fb4049da99388b00e811a9d27ac9e1068756cefa580ebcd630492405c29c5b
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5c0129_HFL_000-001a, image: hfl/0495/0495-004.png}
body:
  text: 碧虛子造太史公曰莊子嘗為蒙漆園吏著書十餘萬言漢書藝文志莊子五十二篇隋書經籍志向秀注二十卷郭象注三十三卷又梁曠有南華論二十五卷陶隱居真誥序録曰莊子受長桑公微言撰內篇七卷以三言為題者當是法璇璣之環轉三景之焕明故造真誥編為七目亦用三字為標隱居著述蓋有所宗焉唐天寶中詔册莊子宜依舊號曰南華真經是知南華之義所來尚矣僕自𩮀角好誦是經非事趣時破卷而已斯乃道家之業務在長生久視毁譽兩忘而自信於道矣豈與有待者同日而論哉今述章句復成七卷謂離章辨句委曲枝派也以逍遙游齊物論養生主人間世德充符大宗師應帝王七篇為內實漆園命名之篇也其次止以篇首兩字或三字為題故有外篇十五雜篇十一或謂外雜篇為郭象所删修又按陶隱居曰莊子作內外篇而不言其雜篇復覽前輩注解例多越略殊難稽考今輒於二十六篇之內取兩字標目而一段成篇者得駢拇馬蹄胠篋刻意繕性說劍漁父七篇以配內立名而曰外篇其次讓王盜跖在宥天地天道天運秋水至樂達生山木田子方知北游庚桑楚徐無鬼則陽外物寓言列御寇天下十有九篇比乎內外之日則奇偶交貫取其人物之名則條列自異考其理則符陰陽之數究其義則契言默之微故曰雜篇今於三十三篇之內分作二百五十五章隨指命題號曰章句逐章之下音家解義釋說事類標為章義書成嘗數其正經得六萬五千九百二十三言合馬遷之所記十亡其四矣復將中太一宫寶文統録內有莊子數本及笈中手鈔諸家同異校得國子監景德四年印本不同共三百四十九字仍按所出别疏闕誤一卷以辨疑謬公孫龍三篇以備討尋烏乎後之學者不幸不見漆園簡莢之完篇章之大體妙指浸為諸家裂元豐甲子歲上元日叙
